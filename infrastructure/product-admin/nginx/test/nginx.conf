# CI-only Nginx configuration: the real deny snippet in front of a recording
# backend stub. Used by .github/workflows/product-admin-infrastructure-ci.yml.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        server_name stagingca.test;
        include /etc/nginx/snippets/cosmicforge-internal-deny.conf;

        proxy_set_header Host               $server_name;
        proxy_set_header X-Forwarded-Host   $server_name;
        proxy_set_header X-Original-URL     "";
        proxy_set_header X-Rewrite-URL      "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect off;

        location / {
            proxy_pass http://backend:9000;
            proxy_http_version 1.1;
        }
    }
}
