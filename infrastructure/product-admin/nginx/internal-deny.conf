# Product Admin public-ingress guard (Section 12.1.6).
#
# `include` this file inside EVERY public server block of the Central Admin
# API host (stagingca / production API hostnames), before any `location /`.
# It is location- and server-level only and changes no legitimate route:
# the public API lives under /api/* and /health.
#
# Why these rules hold against path tricks: nginx matches `location` against
# the NORMALIZED URI — percent-decoded once (%69 -> i, %2F -> /), dot
# segments resolved (/api/../internal -> /internal) and, with the default
# `merge_slashes on`, repeated slashes merged. The regexes still allow
# leading repeated slashes in case merge_slashes is ever turned off, and are
# case-insensitive. Anything still percent-encoded after one decode (double
# encoding, e.g. %2569) is refused outright, so no backend ever has to
# decode a second time. Regex locations take precedence over every plain
# prefix location (`location /`), so these win wherever they are included
# unless a `^~` or `=` location for the same path exists (there is none).

# 1. Double-encoded path bytes (%25xx) in the PATH (the query string is not
#    affected). Legitimate API paths never carry an encoded percent sign.
if ($request_uri ~ "^[^?]*%25") { return 400; }

# 2. Private protocol, integration and Bridge paths: never public.
#    Covers /internal, /internal/, /internal/karryam-admin/*, /internal/product-admin/*,
#    /internal/pic/*, and the /_internal variant.
#    The segment must end at a non-name character (/, ;, ., \, end), so
#    /internal;x, /internal.json and /internal\pic are refused as well.
location ~* ^/+_?internal(?:[^a-z0-9_-]|$) { return 404; }

# 3. Private health, sync and metrics endpoints of the private services.
#    The public API health route is /health (exact) and stays public.
location ~* ^/+(?:metrics|sync/status|health/live|health/ready)(?:[^a-z0-9_-]|$) { return 404; }
