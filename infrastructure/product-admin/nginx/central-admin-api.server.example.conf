# Reference server blocks for the public Central Admin API host (template).
#
# The live staging and production Nginx files are operator-managed on the
# VPS and are NOT replaced by any workflow. This template shows the required
# shape; the operator merges the marked lines into the existing server
# block. Hostname and upstream are the real current values (staging):
#   https://stagingca.cosmicforge-healthnet.com  ->  127.0.0.1:4001 (admin-server-staging-app-1:4000)
# Production keeps its own existing hostname/upstream and is not changed by
# the staging work.

# Unknown Host headers (spoofed Host, raw IP, absolute-form targets naming
# another host) never reach an application: close the connection.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stagingca.cosmicforge-healthnet.com;

    # ssl_certificate / ssl_certificate_key: existing operator-managed paths.

    # REQUIRED: private Product Admin paths are never public.
    include /etc/nginx/snippets/cosmicforge-internal-deny.conf;

    # Never forward client-chosen routing or identity headers. The backend
    # selects nothing from Host/X-Forwarded-Host; these values are fixed here.
    proxy_set_header Host               $server_name;
    proxy_set_header X-Forwarded-Host   $server_name;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Original-URL     "";
    proxy_set_header X-Rewrite-URL      "";
    proxy_set_header X-Forwarded-Prefix "";
    # The private services are never upstreams of this host.
    proxy_redirect off;

    # Request-body limit. Nginx's built-in default is 1m, which silently caps
    # every upload at 1 MiB with a bare HTML "413 Request Entity Too Large"
    # that never reaches the API (so small files worked and a 3 MiB PDF did
    # not). The API owns the real limits (MAIL_ATTACHMENT_MAX_BYTES, default
    # 10 MiB, hard maximum 25 MiB; MAIL_MESSAGE_MAX_BYTES) and answers with a
    # structured 413. The proxy only needs to be a ceiling ABOVE the largest
    # value the API can be configured to accept, plus multipart overhead.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # POST /api/mail/v1/drafts/:draftId/attachments (multipart, one file)
    location ~ ^/api/mail/v1/drafts/[^/]+/attachments$ {
        client_max_body_size 26m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # POST /api/mail/v1/marketing/:orgId/contacts/import (CSV, API limit 2 MiB)
    location ~ ^/api/mail/v1/marketing/[^/]+/contacts/import$ {
        client_max_body_size 3m;
        client_body_timeout 60s;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
