# Reference server blocks for the public Central Admin API host (template).
#
# The live staging and production Nginx files are operator-managed on the
# VPS and are NOT replaced by any workflow. This template shows the required
# shape; the operator merges the marked lines into the existing server
# block. Hostname and upstream are the real current values (staging):
#   https://stagingca.cosmicforge-healthnet.com  ->  127.0.0.1:4001 (admin-server-staging-app-1:4000)
# Production keeps its own existing hostname/upstream and is not changed by
# the staging work.

# Unknown Host headers (spoofed Host, raw IP, absolute-form targets naming
# another host) never reach an application: close the connection.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stagingca.cosmicforge-healthnet.com;

    # ssl_certificate / ssl_certificate_key: existing operator-managed paths.

    # REQUIRED: private Product Admin paths are never public.
    include /etc/nginx/snippets/cosmicforge-internal-deny.conf;

    # Never forward client-chosen routing or identity headers. The backend
    # selects nothing from Host/X-Forwarded-Host; these values are fixed here.
    proxy_set_header Host               $server_name;
    proxy_set_header X-Forwarded-Host   $server_name;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Original-URL     "";
    proxy_set_header X-Rewrite-URL      "";
    proxy_set_header X-Forwarded-Prefix "";
    # The private services are never upstreams of this host.
    proxy_redirect off;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
