# Product Admin private services on the shared staging VPS (Section 12.1/12.2).
#
# Deployed ONLY by .github/workflows/product-admin-staging-ops.yml through
# infrastructure/product-admin/release/pa-staging-ops.sh, never by hand and
# never from main. Compose project: cf-product-admin-staging.
#
# Boundary (see network-policy.json, the single source of truth):
#   Central Admin API --unix socket--> Product Integration Core --unix socket--> Karryam Admin
#                                                                 --unix socket--> CF Meet Admin
#   Karryam Admin (+ worker) --TLS 1.3 mTLS :8110 on cf-staging-karryam-bridge--> Karryam Backoffice Bridge
#   CF Meet Admin (+ worker) --TLS 1.3 mTLS to PA_CM_BRIDGE_ADDRESS:8460--> CF Meet Admin Bridge
#       same-host (default): on cf-staging-cfmeet-bridge (internal) via CF Meet's relay
#         cfmeet-admin-bridge-hq-relay at 10.231.14.2 (CF Meet Admin .3, worker .4)
#       tunnel (separate hosts): cf-staging-cfmeet-bridge + private tunnel to CF Meet's host
#   Product Integration Core --cf-staging-hq-private--> DB-A (existing HQ database, alias hq-db)
#   Karryam Admin (+ worker) --cf-staging-karryam-admin-db--> DB-B (karryam-admin-db below)
#   CF Meet Admin (+ worker) --cf-staging-cfmeet-admin-db--> CF Meet Admin database (cfmeet-admin-db below)
# Product Admins never share a network, socket, database or Bridge.
#
# CF Meet Admin is OPTIONAL: its three services are in the compose profile
# "cfmeet", which pa-staging-ops.sh activates only for a release whose
# images.env records CFMEET_ADMIN_IMAGE (a digest). Without the profile the
# project is exactly PIC + Karryam Admin. PIC always mounts the (possibly
# empty) CF Meet socket directory read-only; prepare-host and deploy create it.
# Every network is internal (no route to the internet, no masquerade). The
# one exception is cf-staging-cfmeet-bridge in tunnel mode
# (PA_CM_BRIDGE_MODE=tunnel, separate hosts only): its single permitted egress
# is the CF Meet Bridge tunnel address and port (DOCKER-USER egress allowlist
# in firewall/docker-user-rules.sh); everything else from it is dropped. In
# the default same-host mode it is internal like the others and its only
# other member is CF Meet's relay at .2. No service publishes a host port. Images are immutable digest references
# chosen by the release workflow. Every service starts DISABLED unless the
# operator-managed env file enables it.
#
# Host layout (created by `pa-staging-ops.sh prepare-host`):
#   ${PA_HOST_ROOT}/run/pic            10002:10002 0750  PIC socket (read by the API)
#   ${PA_HOST_ROOT}/run/karryam-admin  10001:10001 0750  Karryam Admin socket (read by PIC)
#   ${PA_HOST_ROOT}/run/cfmeet-admin   10003:10003 0750  CF Meet Admin socket (read by PIC)
#   ${PA_CONFIG_ROOT}/*.env            root 0640         operator-managed, never in git
#   ${PA_CONFIG_ROOT}/secrets/<svc>/   root 0750, files 0640, mounted read-only

name: cf-product-admin-staging

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  privileged: false
  init: true
  restart: unless-stopped
  stop_grace_period: 15s
  pids_limit: 128
  mem_limit: 384m
  memswap_limit: 384m
  cpus: 0.50
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  product-integration-core:
    <<: *hardening
    image: ${PIC_IMAGE:?PIC_IMAGE must be an immutable ghcr.io digest reference}
    user: "10002:10002"
    # Connects to the Karryam Admin socket (group 10001) and, when CF Meet
    # Admin is part of the release, the CF Meet Admin socket (group 10003),
    # both mode 0660. The extra group grants nothing while the directory is empty.
    group_add: ["10001", "10003"]
    environment:
      PIC_ENVIRONMENT: staging
      PIC_EXPECT_ENVIRONMENT: staging
      PIC_LISTEN: unix:/run/cosmicforge/pic/product-integration-core.sock
    env_file:
      - ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/product-integration-core.env
    volumes:
      - type: bind
        source: ${PA_HOST_ROOT:-/srv/cosmicforge/staging}/run/pic
        target: /run/cosmicforge/pic
      - type: bind
        source: ${PA_HOST_ROOT:-/srv/cosmicforge/staging}/run/karryam-admin
        target: /run/cosmicforge/karryam
        read_only: true
      - type: bind
        source: ${PA_HOST_ROOT:-/srv/cosmicforge/staging}/run/cfmeet-admin
        target: /run/cosmicforge/cfmeet
        read_only: true
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/product-integration-core
        target: /run/secrets/product-integration-core
        read_only: true
    networks:
      hq-private: {}
      admin-private: {}
    labels:
      com.cosmicforge.product-admin.role: hq-integration
      com.cosmicforge.product-admin.public: "false"

  karryam-admin:
    <<: *hardening
    image: ${KARRYAM_ADMIN_IMAGE:?KARRYAM_ADMIN_IMAGE must be an immutable ghcr.io digest reference}
    user: "10001:10001"
    environment:
      KARRYAM_ADMIN_ENVIRONMENT: staging
      KARRYAM_ADMIN_EXPECT_ENVIRONMENT: staging
      KARRYAM_ADMIN_LISTEN: unix:/run/cosmicforge/karryam/karryam-admin.sock
    env_file:
      - ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/karryam-admin.env
    volumes:
      - type: bind
        source: ${PA_HOST_ROOT:-/srv/cosmicforge/staging}/run/karryam-admin
        target: /run/cosmicforge/karryam
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/karryam-admin
        target: /run/secrets/karryam-admin
        read_only: true
    networks:
      admin-private: {}
      karryam-bridge: {}
      karryam-admin-db: {}
    depends_on:
      karryam-admin-db:
        condition: service_healthy
    labels:
      com.cosmicforge.product-admin.role: product-admin
      com.cosmicforge.product-admin.public: "false"

  # Stage A worker: same image, separate process, no listener. Talks only to
  # the Bridge and DB-B; never to HQ.
  karryam-admin-worker:
    <<: *hardening
    image: ${KARRYAM_ADMIN_IMAGE:?KARRYAM_ADMIN_IMAGE must be an immutable ghcr.io digest reference}
    command: ["node", "src/worker/index.js"]
    user: "10001:10001"
    # Disabled (the default) the worker exits 1 by design; do not restart-loop it.
    restart: "no"
    healthcheck:
      disable: true
    environment:
      KARRYAM_ADMIN_ENVIRONMENT: staging
      KARRYAM_ADMIN_EXPECT_ENVIRONMENT: staging
    env_file:
      - ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/karryam-admin.env
    volumes:
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/karryam-admin
        target: /run/secrets/karryam-admin
        read_only: true
    networks:
      karryam-bridge: {}
      karryam-admin-db: {}
    depends_on:
      karryam-admin-db:
        condition: service_healthy
    labels:
      com.cosmicforge.product-admin.role: product-admin-worker
      com.cosmicforge.product-admin.public: "false"

  # DB-B: the dedicated Karryam Admin database. Reachable only on its own
  # internal network. Roles (migrator/runtime) are created by the operator
  # from infrastructure/product-admin/postgres-roles.example.sql; the
  # superuser password is a secret file and is never given to a service.
  karryam-admin-db:
    <<: *hardening
    image: ${KARRYAM_ADMIN_DB_IMAGE:?KARRYAM_ADMIN_DB_IMAGE must be an immutable digest reference}
    user: "70:70"
    mem_limit: 512m
    memswap_limit: 512m
    shm_size: 128m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/karryam-admin-db/postgres-password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,uid=70,gid=70,mode=0700
    volumes:
      - type: volume
        source: karryam-admin-db-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/karryam-admin-db
        target: /run/secrets/karryam-admin-db
        read_only: true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      karryam-admin-db: {}
    labels:
      com.cosmicforge.product-admin.role: database-b
      com.cosmicforge.product-admin.public: "false"

  # CF Meet Admin: the independent Product Admin for CF Meet (product id
  # cfmeet). Same hardening as Karryam Admin, its own uid/gid 10003, its own
  # Bridge network and database; it never joins a Karryam or CF Meet network.
  # Fixed address 10.231.14.3 on cf-staging-cfmeet-bridge: CF Meet's relay
  # (10.231.14.2) admits only .3 and .4 (network-policy.json fixed_addresses).
  cfmeet-admin:
    <<: *hardening
    profiles: ["cfmeet"]
    # The placeholder is never deployable: the profile is only activated with a
    # digest, and the policy check refuses any image that is not one.
    image: ${CFMEET_ADMIN_IMAGE:-cfmeet-admin-image-not-set}
    user: "10003:10003"
    environment:
      CFMEET_ADMIN_ENVIRONMENT: staging
      CFMEET_ADMIN_EXPECT_ENVIRONMENT: staging
      CFMEET_ADMIN_LISTEN: unix:/run/cosmicforge/cfmeet/cfmeet-admin.sock
    env_file:
      - ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/cfmeet-admin.env
    volumes:
      - type: bind
        source: ${PA_HOST_ROOT:-/srv/cosmicforge/staging}/run/cfmeet-admin
        target: /run/cosmicforge/cfmeet
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/cfmeet-admin
        target: /run/secrets/cfmeet-admin
        read_only: true
    networks:
      cfmeet-bridge:
        ipv4_address: 10.231.14.3
      cfmeet-admin-db: {}
    depends_on:
      cfmeet-admin-db:
        condition: service_healthy
    labels:
      com.cosmicforge.product-admin.role: product-admin
      com.cosmicforge.product-admin.product: cfmeet
      com.cosmicforge.product-admin.public: "false"

  # CF Meet Stage A worker (event feed and certified dataset pulls): same
  # image, separate process, no listener. Talks only to the CF Meet Bridge
  # (fixed address 10.231.14.4, admitted by CF Meet's relay) and the CF Meet
  # Admin database; never to HQ.
  cfmeet-admin-worker:
    <<: *hardening
    profiles: ["cfmeet"]
    image: ${CFMEET_ADMIN_IMAGE:-cfmeet-admin-image-not-set}
    command: ["node", "src/worker/index.js"]
    user: "10003:10003"
    # Disabled (the default) the worker exits 1 by design; do not restart-loop it.
    restart: "no"
    healthcheck:
      disable: true
    environment:
      CFMEET_ADMIN_ENVIRONMENT: staging
      CFMEET_ADMIN_EXPECT_ENVIRONMENT: staging
    env_file:
      - ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/cfmeet-admin.env
    volumes:
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/cfmeet-admin
        target: /run/secrets/cfmeet-admin
        read_only: true
    networks:
      cfmeet-bridge:
        ipv4_address: 10.231.14.4
      cfmeet-admin-db: {}
    depends_on:
      cfmeet-admin-db:
        condition: service_healthy
    labels:
      com.cosmicforge.product-admin.role: product-admin-worker
      com.cosmicforge.product-admin.product: cfmeet
      com.cosmicforge.product-admin.public: "false"

  # The dedicated CF Meet Admin database (cfmeet_admin). Reachable only on its
  # own internal network. Roles are created by the operator from
  # staging/cfmeet-admin-db-roles.sql; the superuser password is a secret file
  # and is never given to a service.
  cfmeet-admin-db:
    <<: *hardening
    profiles: ["cfmeet"]
    image: ${CFMEET_ADMIN_DB_IMAGE:-cfmeet-admin-db-image-not-set}
    user: "70:70"
    mem_limit: 512m
    memswap_limit: 512m
    shm_size: 128m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/cfmeet-admin-db/postgres-password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,uid=70,gid=70,mode=0700
    volumes:
      - type: volume
        source: cfmeet-admin-db-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${PA_CONFIG_ROOT:-/etc/cosmicforge/staging}/secrets/cfmeet-admin-db
        target: /run/secrets/cfmeet-admin-db
        read_only: true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      cfmeet-admin-db: {}
    labels:
      com.cosmicforge.product-admin.role: cfmeet-admin-database
      com.cosmicforge.product-admin.product: cfmeet
      com.cosmicforge.product-admin.public: "false"

volumes:
  karryam-admin-db-data:
    name: cf-staging-karryam-admin-db-data
  cfmeet-admin-db-data:
    name: cf-staging-cfmeet-admin-db-data

# Created and owned by `pa-staging-ops.sh prepare-host` (internal, except
# cf-staging-cfmeet-bridge in tunnel mode, which is egress-allowlisted; fixed
# subnets from network-policy.json) so membership can be audited and the
# source-owned Bridges (Karryam's Bridge, CF Meet's same-host relay) and the
# existing HQ database can be attached by their owners without joining this
# compose project.
networks:
  hq-private:
    name: cf-staging-hq-private
    external: true
  admin-private:
    name: cf-staging-admin-private
    external: true
  karryam-bridge:
    name: cf-staging-karryam-bridge
    external: true
  karryam-admin-db:
    name: cf-staging-karryam-admin-db
    external: true
  cfmeet-bridge:
    name: cf-staging-cfmeet-bridge
    external: true
  cfmeet-admin-db:
    name: cf-staging-cfmeet-admin-db
    external: true
