# freshclam for CosmicForge Mail. Signatures are fetched from the official
# ClamAV mirror; allow egress to database.clamav.net from this container only.
Foreground yes
# UpdateLogFile is unset: with Foreground yes freshclam logs to the container output.
# (/dev/stdout fails inside the hardened container: "Symbolic link loop".)
LogTime yes
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Checks 12
ConnectTimeout 30
ReceiveTimeout 60
NotifyClamd /etc/clamav/clamd.conf
