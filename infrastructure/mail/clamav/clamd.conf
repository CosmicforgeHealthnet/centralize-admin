# clamd configuration for CosmicForge Mail (INSTREAM over TCP, private network).
# Keep StreamMaxLength >= MAIL_SCANNER_MAX_STREAM_BYTES (default 25M). Anything
# larger is quarantined by the API without being scanned.
Foreground yes
# LogFile is unset: with Foreground yes clamd logs to the container output.
# (/dev/stdout fails inside the hardened container: "Symbolic link loop".)
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo yes
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxConnectionQueueLength 30
MaxThreads 8
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 500
StreamMaxLength 25M
MaxScanSize 100M
MaxFileSize 25M
MaxRecursion 16
MaxFiles 10000
SelfCheck 600
ConcurrentDatabaseReload no
DetectPUA no
HeuristicAlerts yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes
AlertBrokenExecutables yes
AlertEncrypted no
AlertOLE2Macros yes
AlertExceedsMax yes
