name: Admin dependency lockfile remediation (temporary)
on:
  push:
    branches:
      - feat/admin-resilience-healthnet-extraction-20261024
    paths:
      - .github/workflows/admin-lockfile-remediation-temp.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.ref == 'refs/heads/feat/admin-resilience-healthnet-extraction-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remediate production dependency lockfile without bypasses
        working-directory: services/central-admin-api
        run: |
          npm audit fix --omit=dev --package-lock-only
          npm ci
          npm audit --omit=dev
      - name: Commit reviewed dependency lockfile change to feature branch only
        run: |
          set -euo pipefail
          git add -- services/central-admin-api/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): persist npm production dependency remediations'
            git push origin HEAD:feat/admin-resilience-healthnet-extraction-20261024
          fi
