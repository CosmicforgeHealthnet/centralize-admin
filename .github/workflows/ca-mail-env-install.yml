name: CA Mail settings install (manual)

# Installs Mail settings (Resend, AWS S3/KMS, Mail policy) from ONE GitHub
# secret per target into the server .env, without printing any value:
#   CA_STAGING_MAIL_ENV / CA_PRODUCTION_MAIL_ENV  (secrets of the `production`
#   environment, which also holds the VPS root login). Content: KEY=value lines,
#   MAIL_* / RESEND_* only, no *_ENABLED switches.
# Switches are set separately and visibly with the `flags` input
# (e.g. MAIL_ENABLED=true,MAIL_SENDING_ENABLED=true).
# Staging: the committed, secret-free profile infrastructure/mail/env/staging.env
# is installed under CA_STAGING_MAIL_ENV (which overrides it). With
# provider_credentials=shared-from-production, RESEND_API_KEY and
# RESEND_WEBHOOK_SECRET (only those two) are taken from CA_PRODUCTION_MAIL_ENV:
# one Resend account and one webhook serve both deployments. See
# .github/scripts/ca-mail-env-values.py.
# mode=preview is read-only (key NAMES and added/changed/unchanged).
# mode=apply needs confirm=APPLY_MAIL_SETTINGS (staging) or
# APPLY_PRODUCTION_MAIL_SETTINGS (production). See
# .github/scripts/ca-mail-env-install.sh for the checks and the rollback.
# A push to this file only runs the no-secrets validate job (registration).

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/ca-mail-env-install.yml
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      mode:
        type: choice
        options: [preview, apply]
        default: preview
      flags:
        description: "Optional switches, comma separated: MAIL_ENABLED=true,MAIL_SENDING_ENABLED=false (visible in the run)"
        required: false
        default: ''
      confirm:
        description: "apply only: APPLY_MAIL_SETTINGS (staging) or APPLY_PRODUCTION_MAIL_SETTINGS (production)"
        required: false
        default: ''
      provider_credentials:
        description: "staging only: shared-from-production reuses RESEND_API_KEY and RESEND_WEBHOOK_SECRET from CA_PRODUCTION_MAIL_ENV"
        type: choice
        options: [secret, shared-from-production]
        default: secret

permissions:
  contents: read

concurrency:
  group: ca-mail-env-install-${{ inputs.target || 'push' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (no secrets, no connection)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash -n .github/scripts/ca-mail-env-install.sh && python3 -m py_compile .github/scripts/ca-mail-env-values.py && sha256sum .github/scripts/ca-mail-env-install.sh

  install:
    name: Mail settings ${{ inputs.mode }} (${{ inputs.target }})
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check the typed confirmation
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == apply ]]; then
            want=APPLY_MAIL_SETTINGS; [[ "$TARGET" == production ]] && want=APPLY_PRODUCTION_MAIL_SETTINGS
            [[ "$CONFIRM" == "$want" ]] || { echo "apply on $TARGET needs confirm=$want. Nothing was started."; exit 1; }
          else
            [[ -z "$CONFIRM" ]] || { echo 'preview takes no confirmation.'; exit 1; }
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Connect to the Contabo VPS (pinned host key, root only)
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          SSHPASS: ${{ secrets.PROD_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PROD_HOST" && -n "$PROD_USER" && -n "$SSHPASS" ]] || { echo 'VPS credentials are not set.'; exit 1; }
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq sshpass >/dev/null; }
          hosts="$RUNNER_TEMP/known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$PROD_HOST" 2>/dev/null > "$hosts" || true
          [[ "$(ssh-keygen -l -E sha256 -f "$hosts" | awk 'NR==1{print $2}')" == "SHA256:sHGYhFq6RrV3KXESJX+/+89tEWQaGiSVsdkIXiFR9JQ" ]] \
            || { echo 'BLOCKED: host is not the Contabo VPS (SSH host key differs). Nothing changed.'; exit 1; }
          cat > "$RUNNER_TEMP/ssh" <<EOF
          #!/usr/bin/env bash
          exec sshpass -e ssh -T -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive \
            -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" "\$@"
          EOF
          chmod 700 "$RUNNER_TEMP/ssh"
          [[ "$("$RUNNER_TEMP/ssh" 'id -u')" == 0 ]] || { echo 'BLOCKED: the VPS account is not root. Nothing changed.'; exit 1; }
          script=.github/scripts/ca-mail-env-install.sh
          sha="$(sha256sum "$script" | cut -d' ' -f1)"
          echo "SCRIPT_SHA256=$sha" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ssh" "umask 077; mkdir -p \"\$HOME/.ca-mail-env\" && cat > \"\$HOME/.ca-mail-env/install-$sha.sh\" && sha256sum \"\$HOME/.ca-mail-env/install-$sha.sh\"" < "$script" | grep -q "^$sha " \
            || { echo 'Uploaded script checksum mismatch.'; exit 1; }

      - name: Install (values travel only inside the encrypted SSH stdin)
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          FLAGS: ${{ inputs.flags }}
          CREDENTIALS: ${{ inputs.provider_credentials }}
          PROFILE: infrastructure/mail/env/staging.env
          SSHPASS: ${{ secrets.PROD_PASSWORD }}
          STAGING_VALUES: ${{ secrets.CA_STAGING_MAIL_ENV }}
          PRODUCTION_VALUES: ${{ secrets.CA_PRODUCTION_MAIL_ENV }}
        run: |
          set -euo pipefail
          ssh="$RUNNER_TEMP/ssh"
          [[ "$FLAGS" =~ ^[A-Z0-9_=,a-z\ ]*$ ]] || { echo 'flags contain unexpected characters.'; exit 1; }
          if [[ "$TARGET" == production && -z "$PRODUCTION_VALUES" && -z "$FLAGS" ]]; then
            echo 'Secret CA_PRODUCTION_MAIL_ENV is empty and no flags were given. Add the secret to the production environment.'; exit 1
          fi
          # Values are assembled in memory and streamed into the SSH session;
          # only key names and their source are printed.
          values="$(python3 .github/scripts/ca-mail-env-values.py)" || exit 1
          run="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          d="\$HOME/.ca-mail-env"
          printf '%s\n' "$values" | "$ssh" "umask 077; cat > $d/values-$run"
          unset STAGING_VALUES PRODUCTION_VALUES values
          "$ssh" "bash $d/install-$SCRIPT_SHA256.sh --$MODE $TARGET $d/values-$run '$FLAGS'; rc=\$?; rm -f $d/values-$run; exit \$rc" | tee run.out

      - name: Summarise
        if: always()
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
        run: |
          test -s run.out || exit 0
          { echo "## Mail settings $MODE ($TARGET)"; echo; echo '```'
            sed -n '/==================== SUMMARY ====================/,$p' run.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
