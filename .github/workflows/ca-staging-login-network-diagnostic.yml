name: CA staging login network diagnostic (read-only)

# No user credentials sent. No database, DNS, container, or deployment changes.
on:
  push:
    branches: [staging]
    paths: [.github/workflows/ca-staging-login-network-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Public API and origin transport checks
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Public DNS TLS HTTP health and browser CORS
        shell: bash
        run: |
          set -uo pipefail
          host=stagingca.cosmicforge-healthnet.com
          url="https://$host"
          origin=https://centralize-admin-staging.vercel.app
          ip=173.249.30.55
          probe() {
            local label="$1"; shift
            local out rc
            out="$(curl --silent --show-error --connect-timeout 6 --max-time 14 --ipv4 \
              -o /dev/null -w '%{http_code}' "$@" 2>/dev/null)"
            rc=$?
            echo "$label: curl_exit=$rc http_status=${out:-000}" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo '## Centralize Admin staging login transport check' >> "$GITHUB_STEP_SUMMARY"
          if getent ahostsv4 "$host" >/dev/null 2>&1; then
            echo 'DNS: RESOLVES' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'DNS: FAILED' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          probe 'Public API /health (DNS+TLS+Nginx+HTTP)' "$url/health"
          probe 'Direct VPS /health (bypass DNS, keep TLS/SNI)' --resolve "$host:443:$ip" "$url/health"
          probe 'Public API CORS OPTIONS /api/auth/login' \
            -X OPTIONS -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$url/api/auth/login"
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          curl --silent --show-error --connect-timeout 6 --max-time 14 --ipv4 \
            -X OPTIONS -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -D "$headers" -o /dev/null "$url/api/auth/login" 2>/dev/null
          rc=$?
          allowed="$(grep -i '^access-control-allow-origin:' "$headers" | tr -d '\r' | tail -1 | sed -E 's/^[^:]+: *//' || true)"
          creds="$(grep -i '^access-control-allow-credentials:' "$headers" | tr -d '\r' | tail -1 | sed -E 's/^[^:]+: *//' || true)"
          [[ "$allowed" == "$origin" ]] && ao=yes || ao=no
          [[ "$creds" == true ]] && ac=yes || ac=no
          echo "CORS: probe_exit=$rc allowed_origin_matches=$ao credentials_allowed=$ac" | tee -a "$GITHUB_STEP_SUMMARY"
          probe 'Staging frontend' "$origin/"
          # Browser preflight may include CSRF and bearer headers from session state.
          auth_headers="$(mktemp)"
          curl --silent --show-error --connect-timeout 6 --max-time 14 \
            -X OPTIONS -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization,x-csrf-token' \
            -D "$auth_headers" -o /dev/null "$url/api/auth/login" 2>/dev/null
          auth_rc=$?
          auth_origin="$(grep -i '^access-control-allow-origin:' "$auth_headers" | tr -d '\r' | tail -1 | sed -E 's/^[^:]+: *//' || true)"
          auth_allowed="$(grep -i '^access-control-allow-headers:' "$auth_headers" | tr -d '\r' | tail -1 | sed -E 's/^[^:]+: *//' | tr '[:upper:]' '[:lower:]' || true)"
          auth_ok=yes
          for h in content-type authorization x-csrf-token; do
            [[ ",$auth_allowed," == *"$h"* ]] || auth_ok=no
          done
          [[ "$auth_origin" == "$origin" ]] && auth_origin_ok=yes || auth_origin_ok=no
          echo "Browser auth-header preflight: exit=$auth_rc origin_allowed=$auth_origin_ok headers_allowed=$auth_ok" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$auth_headers"

          # No credentials: malformed login body must return an HTTP response.
          probe 'Malformed POST /api/auth/login (no credentials)' \
            -X POST -H "Origin: $origin" -H 'Content-Type: application/json' \
            --data '{}' "$url/api/auth/login"

          # Chrome may choose IPv6 even when an IPv4-only check passed.
          # DNS AAAA record, rather than assuming getent address family means DNS.
          if command -v dig >/dev/null 2>&1; then
            aaaa="$(dig +time=3 +tries=1 +short AAAA "$host" 2>/dev/null | grep -E '^[0-9A-Fa-f:]+$' | sort -u | paste -sd ',' - || true)"
          else
            aaaa="$(getent ahostsv6 "$host" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd ',' - || true)"
          fi
          if [[ -n "$aaaa" ]]; then
            echo "DNS AAAA: PRESENT ($aaaa)" | tee -a "$GITHUB_STEP_SUMMARY"
            if v6status="$(curl --silent --show-error --connect-timeout 6 --max-time 14 --ipv6 -o /dev/null -w '%{http_code}' "$url/health" 2>/dev/null)"; then
              v6rc=0
            else
              v6rc=$?
            fi
            echo "Public API IPv6 /health: curl_exit=$v6rc http_status=${v6status:-000}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'DNS AAAA: ABSENT' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Compare the deployed login page's own loaded JS assets to the
          # configured API origin. Only report known hostnames, never JS code.
          html="$(mktemp)"; scripts="$(mktemp)"
          trap 'rm -f "$headers" "$html" "$scripts"' EXIT
          if curl -fsSL --connect-timeout 6 --max-time 15 -o "$html" "$origin/"; then
            grep -oE 'src="/_next/static/[^"]+\.js[^"]*"' "$html" |
              sed -E 's/^src="([^"]+)"$/\1/' | head -40 > "$scripts" || true
            chunks=0; saw_staging=no; saw_localhost=no; saw_prod=no
            while IFS= read -r asset; do
              [[ "$asset" == /_next/static/* ]] || continue
              js="$(mktemp)"
              if curl -fsSL --connect-timeout 5 --max-time 12 -o "$js" "$origin$asset"; then
                chunks=$((chunks + 1))
                grep -Fq 'stagingca.cosmicforge-healthnet.com' "$js" && saw_staging=yes
                grep -Fq 'localhost:4000' "$js" && saw_localhost=yes
                grep -Fq 'https://api.cosmicforge-healthnet.com' "$js" && saw_prod=yes
              fi
              rm -f "$js"
            done < "$scripts"
            echo "Loaded Next.js chunks: $chunks; staging_host_seen=$saw_staging localhost_seen=$saw_localhost production_host_seen=$saw_prod" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Frontend HTML unavailable for bundle check' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check application origin internally through restricted staging SSH
        shell: bash
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -uo pipefail
          umask 077
          key="$(mktemp)"; hosts="$(mktemp)"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$STAGING_SSH_KEY" > "$key"
          if [[ ! -s "$key" ]]; then
            echo 'Origin app: SSH key missing' | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          ssh-keyscan -T 8 -t ed25519 173.249.30.55 2>/dev/null > "$hosts"
          if [[ ! -s "$hosts" ]]; then
            echo 'Origin app: SSH unreachable' | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          actual="$(ssh-keygen -l -E sha256 -f "$hosts" | awk '{print $2}')"
          if [[ "$actual" != 'SHA256:sHGYhFq6RrV3KXESJX+/+89tEWQaGiSVsdkIXiFR9JQ' ]]; then
            echo 'Origin app: SSH fingerprint mismatch; no connection attempted' | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          status="$(ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" \
            cf-staging-deploy@173.249.30.55 \
            'docker exec admin-server-staging-app-1 node -e '"'"'fetch("http://127.0.0.1:" + (process.env.PORT || "4000") + "/health", {signal: AbortSignal.timeout(5000)}).then(r => {console.log("INTERNAL_HTTP_STATUS="+r.status)}).catch(() => { console.log("INTERNAL_HTTP_FAILED"); process.exitCode=1})'"'"'' 2>/dev/null)"
          rc=$?
          if [[ "$rc" == 0 && "$status" =~ ^INTERNAL_HTTP_STATUS=[0-9]{3}$ ]]; then
            echo "Origin app: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Origin app: failed/unavailable (ssh_or_exec_exit=$rc)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
