name: Centralized Admin Frontend CI

on:
  pull_request:
    paths:
      - "apps/central-admin-web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/central-admin-web/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-frontend-ci
  cancel-in-progress: false

jobs:
  frontend:
    name: Lint and build Next.js admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/central-admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/central-admin-web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Check all frontend TypeScript diagnostics
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false
      - name: Build frontend
        id: build
        run: npm run build
      - name: Enforce successful typecheck
        if: always() && steps.typecheck.outcome == 'failure'
        run: |
          echo "Frontend TypeScript errors remain; see diagnostics step output."
          exit 1
      - name: Enforce successful lint
        if: always() && steps.lint.outcome == 'failure'
        run: |
          echo "Frontend lint errors remain; see lint step output."
          exit 1

  e2e:
    name: Mail E2E (Playwright, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/central-admin-web
    env:
      # The API host is never started: every call is answered by page.route
      # mocks in e2e/fixtures.ts and all other off-origin requests are aborted.
      NEXT_PUBLIC_API_URL: http://localhost:4999
      # Exercise the normal staging administrator Mail shell even when the API is disabled.
      NEXT_PUBLIC_STAGING_MAIL_NAV_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/central-admin-web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend against the mocked API origin
        run: npm run build
      - name: Run Mail E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/central-admin-web/playwright-report
            apps/central-admin-web/test-results
          retention-days: 7
