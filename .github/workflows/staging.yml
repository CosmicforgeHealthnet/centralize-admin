name: Social Operations CI

on:
  pull_request:
  push:
    branches:
      - fix/marketing-admin-db-target
      - staging
  workflow_dispatch:

jobs:
  verify:
    name: Verify Social Operations backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/central-admin-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosmicforge_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmicforge_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmicforge_admin
      SOCIAL_WORKERS_ENABLED: "false"
      SOCIAL_PUBLISHING_WORKER_ENABLED: "false"
      SOCIAL_ACTION_WORKER_ENABLED: "false"
      SOCIAL_REDACTION_WORKER_ENABLED: "false"
      SOCIAL_INBOX_ENABLED: "false"
      SOCIAL_PHASE_D_ENABLED: "false"
      TEST_NETWORK_GUARD_ENABLED: "true"
      MARKETING_INTELLIGENCE_SYNC_ENABLED: "false"
      MARKETING_INTELLIGENCE_BOOTSTRAP_CONNECTIONS: "false"
      META_SOCIAL_ENABLED: "false"
      TIKTOK_SOCIAL_ENABLED: "false"
      X_SOCIAL_ENABLED: "false"
      LINKEDIN_SOCIAL_ENABLED: "false"
      SOCIAL_MEDIA_STORAGE_PROVIDER: "local"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/central-admin-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve available production dependency advisories without breaking semver
        run: |
          # Keep the audit strict; npm may update only within accepted version ranges.
          # Reinstall from the resulting lockfile so subsequent tests run against
          # exactly the dependency graph later used to build the staging image.
          npm audit fix --omit=dev --package-lock-only
          npm ci

      - name: Prisma format check
        run: |
          npx prisma format --schema prisma/schema.prisma
          git diff --exit-code -- prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Prisma generate
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Validate Social Operations configuration
        run: |
          npm run config:validate
          npm run config:validate:staging
          npm run config:validate:production

      - name: Verify migration manifest
        run: npm run db:manifest:verify

      - name: Verify Admin database target
        run: npm run db:admin:guard

      - name: Push Prisma schema to Admin database
        run: npx prisma db push --schema prisma/schema.prisma

      - name: Apply Admin database PostgreSQL-only artifacts
        run: npm run db:admin:prepare

      - name: Assert PostgreSQL Social Operations schema
        run: |
          npm run db:schema:assert

      - name: Migration safety check
        run: npm run migrations:safety

      - name: Redacted secret scan
        run: npm run security:secret-scan

      - name: Dependency audit policy (production only)
        run: npm audit --omit=dev

      - name: Static Social Operations safety checks
        run: |
          npm run security:static-social
          npm run security:network-guard-static

      - name: SBOM inventory
        run: npm run security:sbom > /tmp/social-operations-sbom.json

      - name: Runtime network guard negative tests
        run: npm run test:network-guard

      - name: Focused Social Operations tests
        run: npm run test:social-operations

      - name: Upload focused Social Operations failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: social-operations-focused-tests
          path: |
            services/central-admin-api/artifacts/social-operations-focused-tests.tap
            services/central-admin-api/artifacts/social-operations-focused-summary.json
            services/central-admin-api/artifacts/social-operations-focused-files.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Full test suite
        run: npm test

      - name: Preserve the security-audited dependency manifest for image build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: staging-audited-dependencies
          path: |
            services/central-admin-api/package.json
            services/central-admin-api/package-lock.json
          if-no-files-found: error
          retention-days: 7

  # Backend deployment is intentionally attached to the existing CI job.
  # On staging pushes, a failed test/security check cannot publish or deploy.
  verify-staging-ssh:
    name: Verify Contabo SSH key and staging account
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify deployment key identity and reachable staging SSH account
        shell: bash
        env:
          STAGING_HOST: 173.249.30.55
          STAGING_USER: cf-staging-deploy
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_HOST" || -z "$STAGING_USER" || -z "$STAGING_SSH_KEY" ]]; then
            echo "::error::Missing staging deploy SSH private key in the staging environment."
            exit 1
          fi
          umask 077
          private_key="$(mktemp)"
          public_key="$(mktemp)"
          host_keys="$(mktemp)"
          trap 'rm -f "$private_key" "$public_key" "$host_keys"' EXIT
          printf '%s\n' "$STAGING_SSH_KEY" > "$private_key"
          if ! ssh-keygen -y -P '' -f "$private_key" > "$public_key" 2>/dev/null; then
            echo "::error::STAGING_SSH_KEY is not a valid unencrypted private key. Re-copy the entire private key (including BEGIN/END lines) into the staging environment secret."
            exit 1
          fi
          fingerprint="$(ssh-keygen -l -E sha256 -f "$public_key" | awk '{print $2}')"
          if [[ "$fingerprint" != "SHA256:LSVBOgX3GxSbGvrqRUwA/BYxw2zVxdvQUQLnV6ALW+4" ]]; then
            echo "::error::The private key in GitHub does not match the working Windows cf-staging-deploy key fingerprint."
            exit 1
          fi
          echo "GitHub staging deployment key matches expected public fingerprint."
          ssh-keyscan -T 10 -t ed25519 "$STAGING_HOST" 2>/dev/null > "$host_keys"
          if [[ ! -s "$host_keys" ]]; then
            echo "::error::Contabo staging SSH service is unreachable."
            exit 1
          fi
          server_fingerprint="$(ssh-keygen -l -E sha256 -f "$host_keys" | awk '{print $2}')"
          if [[ "$server_fingerprint" != "SHA256:sHGYhFq6RrV3KXESJX+/+89tEWQaGiSVsdkIXiFR9JQ" ]]; then
            echo "::error::Contabo SSH host key does not match the previously observed host fingerprint; deployment stopped."
            exit 1
          fi
          ssh -i "$private_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$host_keys" \
            "$STAGING_USER@$STAGING_HOST" \
            "docker ps --filter name=admin-server-staging-app-1 >/dev/null"
          echo "GitHub Actions authenticated to the staging Contabo Docker account."

  build-staging-image:
    name: Publish immutable staging API image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    needs: [verify, verify-staging-ssh]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the exact dependency manifest verified by staging CI
        uses: actions/download-artifact@v4
        with:
          name: staging-audited-dependencies
          path: services/central-admin-api
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable image tag
        id: image
        run: echo "tag=ghcr.io/cosmicforgehealthnet/admin-backend:staging-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend (monorepo Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}

  deploy-staging-api:
    name: Deploy staging API to Contabo and verify login
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    needs: build-staging-image
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: central-admin-api-staging-vps
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require staging-only deployment credentials
        shell: bash
        env:
          STAGING_HOST: 173.249.30.55
          STAGING_USER: cf-staging-deploy
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_HOST" || -z "$STAGING_USER" || -z "$STAGING_SSH_KEY" ]]; then
            echo "::error::Set STAGING_SSH_KEY in the staging GitHub environment. Production secrets are intentionally not used."
            exit 1
          fi
      - name: Pull and deploy only the staging app, with automatic rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-staging-image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          host: 173.249.30.55
          username: cf-staging-deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: SHA256:sHGYhFq6RrV3KXESJX+/+89tEWQaGiSVsdkIXiFR9JQ
          port: 22
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_RUN_ID
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            cd /var/www/admin-server-staging
            test -f docker-compose.yml
            test -n "$IMAGE_TAG"
            case "$IMAGE_TAG" in
              ghcr.io/cosmicforgehealthnet/admin-backend:staging-*) ;;
              *) echo "Unexpected image repository/tag"; exit 1 ;;
            esac

            # Never operate on /var/www/admin-server or production Compose.
            container="admin-server-staging-app-1"
            test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$container")" = "app"
            test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$container")" = "admin-server-staging"
            # Production main database access is forbidden for this staging rollout.
            db_env="$(docker exec "$container" node -p 'process.env.MAIN_DB_ENV || "dev"')"
            if [ "$db_env" != "dev" ]; then
              echo "Refusing deployment: staging MAIN_DB_ENV is not dev."
              exit 1
            fi
            old_id="$(docker inspect -f '{{.Image}}' "$container")"
            rollback_image="cf-admin-api:staging-rollback-$DEPLOY_RUN_ID"
            docker image tag "$old_id" "$rollback_image"

            # Use a disposable Docker auth configuration. Never persist the
            # GitHub Actions token or Docker registry credentials on the VPS.
            auth_dir="$(mktemp -d)"
            export DOCKER_CONFIG="$auth_dir"
            trap 'rm -rf "$auth_dir"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
            docker pull "$IMAGE_TAG"
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf "$auth_dir"
            unset DOCKER_CONFIG GHCR_TOKEN

            # Store override in the deploy user home; no write access to
            # the root-owned deployment directory is required.
            override="$HOME/docker-compose.github-staging.yml"
            deploy_app() {
              docker compose -f docker-compose.yml -f "$override" up -d --no-deps --no-build --pull never --force-recreate app
            }
            rollback() {
              echo "Staging release failed verification: restoring previous image."
              printf 'services:\n  app:\n    image: %s\n    pull_policy: never\n' "$rollback_image" > "$override"
              deploy_app || true
              echo "Rollback initiated. Production and staging database untouched."
            }
            printf 'services:\n  app:\n    image: %s\n    pull_policy: never\n' "$IMAGE_TAG" > "$override"

            if ! deploy_app; then
              rollback
              exit 1
            fi

            ok=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 4 http://127.0.0.1:4001/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "Staging HTTP health failed."
              rollback
              exit 1
            fi

            # Verify login's database, not merely the /health liveness route.
            if ! docker exec "$container" node -e '
              const { prisma } = require("./src/shared/config/database");
              prisma.adminUser.count().then(() => console.log("Admin DB login query OK"))
                .catch(e => { console.error("Admin DB query failed:", e.code || e.name); process.exitCode=1; })
                .finally(() => prisma.$disconnect());
            '; then
              rollback
              exit 1
            fi

            headers="$(mktemp)"
            status="$(curl -sS --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS               -H 'Origin: https://centralize-admin-staging.vercel.app'               -H 'Access-Control-Request-Method: POST'               -H 'Access-Control-Request-Headers: Content-Type'               https://stagingca.cosmicforge-healthnet.com/api/auth/login)" || status="000"
            if [ "$status" != "200" ] ||                ! grep -qi '^access-control-allow-origin: https://centralize-admin-staging\.vercel\.app' "$headers" ||                ! grep -qi '^access-control-allow-credentials: true' "$headers"; then
              echo "Staging HTTPS login CORS verification failed (HTTP $status)."
              rm -f "$headers"
              rollback
              exit 1
            fi
            rm -f "$headers"

            # Main DB has shown timeouts on this VPS. Report degraded status
            # without confusing it with the admin_users login database.
            if ! timeout 45 docker exec "$container" node -e '
              const { mainPrisma } = require("./src/shared/config/mainDatabase");
              mainPrisma.users.count().then(() => console.log("Main DEV DB query OK"))
                .catch(e => { console.error("Main DEV DB query failed:", e.code || e.name); process.exitCode=1; })
                .finally(() => mainPrisma.$disconnect());
            '; then
              echo "WARNING: Main DEV DB query failed; dashboard/Main DB functions remain degraded."
            fi
            echo "SUCCESS: staging API, admin_users query and HTTPS login CORS verified."
