name: Product Admin Infrastructure Security CI

# Section 12.1/12.2/12.4 and 13.1.8-13.1.9 on disposable infrastructure only:
#   static     policy/compose/Nginx/firewall checks, release state machine
#   nginx      the real deny snippet in a real Nginx, probed with raw requests
#   rehearsal  the exact staging host operations script on this runner
#              (PIC, Karryam Admin and CF Meet Admin together):
#              prepare host (networks, dirs, DOCKER-USER), deploy by digest,
#              network probes, DB role audit, backup + restore drill,
#              migration preview/apply, enabled deploy, second release,
#              rollback, refused bad configuration, emergency disable, and
#              S0-S2 release state with evidence (environment "rehearsal").
#              CF Meet Bridge in tunnel mode (separate hosts; netns peer).
#   rehearsal-same-host
#              the same script in the default same-host CF Meet transport:
#              internal cf-staging-cfmeet-bridge, a stand-in CF Meet relay
#              at .2 with a .3/.4 ACL, exact membership and fixed addresses,
#              unauthorized containers refused, no 8460 on the host, and the
#              host-side switch same-host -> tunnel -> same-host.
# Nothing here connects to the VPS or reads staging/production secrets. A
# rehearsal never counts as staging evidence.

on:
  pull_request:
    paths:
      - "infrastructure/product-admin/**"
      - "infrastructure/scripts/product-admin-*"
      - "infrastructure/scripts/tests/**"
      - "services/karryam-admin/**"
      - "services/cfmeet-admin/**"
      - "services/product-integration-core/**"
      - "packages/**"
      - ".github/workflows/product-admin-infrastructure-ci.yml"
      - ".github/workflows/product-admin-staging-ops.yml"
  push:
    branches: [staging]
    paths:
      - "infrastructure/product-admin/**"
      - "infrastructure/scripts/product-admin-*"
      - "infrastructure/scripts/tests/**"
      - "services/karryam-admin/**"
      - "services/cfmeet-admin/**"
      - "services/product-integration-core/**"
      - "packages/**"
      - ".github/workflows/product-admin-infrastructure-ci.yml"
      - ".github/workflows/product-admin-staging-ops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-admin-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Policy, compose, Nginx, firewall and release-state checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Infrastructure unit tests (checker, release state machine, evidence, certification tools)
        run: node --test infrastructure/scripts/tests/*.test.mjs
      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          for f in infrastructure/product-admin/release/pa-staging-ops.sh infrastructure/product-admin/firewall/docker-user-rules.sh; do bash -n "$f"; done
          shellcheck -S warning infrastructure/product-admin/release/pa-staging-ops.sh infrastructure/product-admin/firewall/docker-user-rules.sh
      - name: Empty placeholder env files at the real host paths (disposable runner; compose requires them to exist)
        run: |
          sudo install -d /etc/cosmicforge/staging
          sudo touch /etc/cosmicforge/staging/product-integration-core.env /etc/cosmicforge/staging/karryam-admin.env
      - name: Karryam + PIC only (CF Meet Admin optional, no CF Meet variables or env file) resolves and passes the policy
        run: |
          set -euo pipefail
          mkdir -p artifacts
          d="$(printf 'a%.0s' $(seq 64))"
          test ! -e /etc/cosmicforge/staging/cfmeet-admin.env
          PIC_IMAGE="ghcr.io/cosmicforgehealthnet/product-integration-core@sha256:$d" KARRYAM_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/karryam-admin@sha256:$d" KARRYAM_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d" \
            docker compose -f infrastructure/product-admin/staging/docker-compose.yml config --format json > artifacts/resolved-compose-karryam-only.json
          node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const cm=Object.keys(m.services).filter((n)=>n.startsWith("cfmeet-")); if (cm.length) { console.error("cfmeet services without the profile:", cm); process.exit(1); }' artifacts/resolved-compose-karryam-only.json
          node infrastructure/scripts/product-admin-infra-check.mjs --compose-json artifacts/resolved-compose-karryam-only.json --require-digests --report artifacts/product-admin-network-policy-report-karryam-only.json
          # The same model claimed as a CF Meet release is refused.
          if node infrastructure/scripts/product-admin-infra-check.mjs --compose-json artifacts/resolved-compose-karryam-only.json --require-digests --require-product cfmeet >/dev/null; then echo "::error::a model without CF Meet Admin passed --require-product cfmeet"; exit 1; fi
      - name: Resolved staging compose model with CF Meet Admin (profile cfmeet) passes the policy (digest-pinned)
        run: |
          set -euo pipefail
          sudo touch /etc/cosmicforge/staging/cfmeet-admin.env
          d="$(printf 'a%.0s' $(seq 64))"
          export PIC_IMAGE="ghcr.io/cosmicforgehealthnet/product-integration-core@sha256:$d" KARRYAM_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/karryam-admin@sha256:$d" KARRYAM_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d"
          export CFMEET_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/cfmeet-admin@sha256:$d" CFMEET_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d"
          docker compose -f infrastructure/product-admin/staging/docker-compose.yml --profile cfmeet config --format json > artifacts/resolved-compose.json
          node infrastructure/scripts/product-admin-infra-check.mjs --compose-json artifacts/resolved-compose.json --require-digests --require-product cfmeet --report artifacts/product-admin-network-policy-report.json
      - name: A mutable tag or a missing image reference is refused
        run: |
          set -euo pipefail
          d="$(printf 'a%.0s' $(seq 64))"
          PIC_IMAGE="ghcr.io/cosmicforgehealthnet/product-integration-core:staging-latest" KARRYAM_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/karryam-admin@sha256:$d" KARRYAM_ADMIN_DB_IMAGE="postgres:16-alpine" \
            CFMEET_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/cfmeet-admin@sha256:$d" CFMEET_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d" \
            docker compose -f infrastructure/product-admin/staging/docker-compose.yml --profile cfmeet config --format json > /tmp/mutable.json
          if node infrastructure/scripts/product-admin-infra-check.mjs --compose-json /tmp/mutable.json --require-digests; then echo "::error::mutable tags were accepted"; exit 1; fi
          # A mutable CF Meet Admin tag alone is refused as well.
          PIC_IMAGE="ghcr.io/cosmicforgehealthnet/product-integration-core@sha256:$d" KARRYAM_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/karryam-admin@sha256:$d" KARRYAM_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d" \
            CFMEET_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/cfmeet-admin:staging-latest" CFMEET_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d" \
            docker compose -f infrastructure/product-admin/staging/docker-compose.yml --profile cfmeet config --format json > /tmp/mutable-cfmeet.json
          if node infrastructure/scripts/product-admin-infra-check.mjs --compose-json /tmp/mutable-cfmeet.json --require-digests; then echo "::error::a mutable CF Meet Admin tag was accepted"; exit 1; fi
          # The profile without a CF Meet image resolves to the non-deployable placeholder, which is refused.
          PIC_IMAGE="ghcr.io/cosmicforgehealthnet/product-integration-core@sha256:$d" KARRYAM_ADMIN_IMAGE="ghcr.io/cosmicforgehealthnet/karryam-admin@sha256:$d" KARRYAM_ADMIN_DB_IMAGE="docker.io/library/postgres@sha256:$d" \
            docker compose -f infrastructure/product-admin/staging/docker-compose.yml --profile cfmeet config --format json > /tmp/placeholder-cfmeet.json
          if node infrastructure/scripts/product-admin-infra-check.mjs --compose-json /tmp/placeholder-cfmeet.json --require-digests; then echo "::error::the CF Meet placeholder image was accepted"; exit 1; fi
          if docker compose -f infrastructure/product-admin/staging/docker-compose.yml config >/dev/null 2>&1; then echo "::error::compose resolved without image references"; exit 1; fi
      - name: Alert rules are valid Prometheus rules (promtool)
        run: docker run --rm -v "$PWD/infrastructure/product-admin/monitoring:/w:ro" --entrypoint promtool prom/prometheus:v2.53.0 check rules /w/alerts.yml
      - name: Redacted secret scan (includes infrastructure/product-admin)
        run: node services/central-admin-api/scripts/social-operations/secret-scan.js --product-admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-admin-network-policy-report
          path: artifacts/
          if-no-files-found: warn

  nginx:
    name: Public ingress denial (real Nginx, raw-request probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start Nginx with the deny snippet in front of a recording backend
        run: |
          set -euo pipefail
          t="$GITHUB_WORKSPACE/infrastructure/product-admin/nginx"
          docker network create nginx-probe >/dev/null
          docker run -d --name backend --network nginx-probe --network-alias backend -p 127.0.0.1:19001:9001 \
            -v "$t/test/backend-stub.mjs:/stub.mjs:ro" node:22-alpine node /stub.mjs >/dev/null
          docker run -d --name nginx --network nginx-probe -p 127.0.0.1:18080:8080 \
            -v "$t/test/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$t/internal-deny.conf:/etc/nginx/snippets/cosmicforge-internal-deny.conf:ro" nginx:1.27-alpine >/dev/null
          docker exec nginx nginx -t
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:19001/ >/dev/null 2>&1 && curl -s -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
      - name: Probe (encoding, dot segments, slashes, case, Host and absolute-form tricks)
        run: |
          mkdir -p artifacts
          node infrastructure/product-admin/nginx/test/probe.mjs --target http://127.0.0.1:18080 --host stagingca.test --control http://127.0.0.1:19001 --report artifacts/product-admin-ingress-probe.json
      - name: Nginx logs on failure
        if: failure()
        run: docker logs nginx 2>&1 | tail -n 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-admin-ingress-probe
          path: artifacts/
          if-no-files-found: warn

  rehearsal:
    name: Staging host rehearsal (prepare, deploy, probe, migrate, rollback, disable)
    needs: [static, nginx]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PA_REHEARSAL: "1"
      PA_HQ_DB_CONTAINER: rehearsal-hq-db
      PA_API_CONTAINER: rehearsal-api
      PA_BRIDGE_CONTAINER: rehearsal-bridge
      PA_BRIDGE_ADDRESS: 10.231.12.10
      # Tunnel transport (separate hosts). The default same-host transport is rehearsed in rehearsal-same-host.
      PA_CM_BRIDGE_MODE: tunnel
      # Stand-in for the private tunnel to CF Meet's host: CF Meet side 10.250.0.1 (the bridge address), HQ side 10.250.0.2.
      PA_CM_BRIDGE_ADDRESS: 10.250.0.1
      PA_CM_BRIDGE_PORT: "8460"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: product-admin-ingress-probe
          path: ${{ runner.temp }}/probe
      - name: Rehearsal layout and ops wrapper
        run: |
          set -euo pipefail
          echo "PA_HOST_ROOT=$RUNNER_TEMP/host" >> "$GITHUB_ENV"
          echo "PA_CONFIG_ROOT=$RUNNER_TEMP/etc" >> "$GITHUB_ENV"
          echo "PA_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "PA_LOGS=$GITHUB_WORKSPACE/_rehearsal" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/_rehearsal"
          cat > "$RUNNER_TEMP/ops" <<'SH'
          #!/usr/bin/env bash
          # Runs the real host script as root, like the VPS workflow does.
          set -o pipefail
          op="$1"; shift
          sudo env PA_REHEARSAL=1 PA_HOST_ROOT="$PA_HOST_ROOT" PA_CONFIG_ROOT="$PA_CONFIG_ROOT" PA_HQ_DB_CONTAINER="$PA_HQ_DB_CONTAINER" \
            PA_API_CONTAINER="$PA_API_CONTAINER" PA_BRIDGE_CONTAINER="$PA_BRIDGE_CONTAINER" PA_BRIDGE_ADDRESS="$PA_BRIDGE_ADDRESS" \
            PA_CM_BRIDGE_MODE="${PA_CM_BRIDGE_MODE:-same-host}" PA_CM_BRIDGE_ADDRESS="${PA_CM_BRIDGE_ADDRESS:-}" PA_CM_BRIDGE_PORT="${PA_CM_BRIDGE_PORT:-8460}" \
            PA_PIC_IMAGE="${PA_PIC_IMAGE:-}" PA_KA_IMAGE="${PA_KA_IMAGE:-}" PA_CM_IMAGE="${PA_CM_IMAGE:-}" PA_RELEASE_SHA="${PA_RELEASE_SHA:-}" PA_RUN_ID="${GITHUB_RUN_ID}-${op}-$RANDOM" "$@" \
            bash "$GITHUB_WORKSPACE/infrastructure/product-admin/release/pa-staging-ops.sh" "$op" 2>&1 | tee -a "$PA_LOGS/$op.log"
          SH
          chmod +x "$RUNNER_TEMP/ops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build release images (revision label = this commit) and push to a local registry for real digests
        run: |
          set -euo pipefail
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2 >/dev/null
          build() { # sha suffix
            docker build -q --label "org.opencontainers.image.revision=$1" -f services/karryam-admin/Dockerfile -t "127.0.0.1:5000/karryam-admin:$2" . >/dev/null
            docker build -q --label "org.opencontainers.image.revision=$1" -f services/product-integration-core/Dockerfile -t "127.0.0.1:5000/product-integration-core:$2" . >/dev/null
            docker build -q --label "org.opencontainers.image.revision=$1" -f services/cfmeet-admin/Dockerfile -t "127.0.0.1:5000/cfmeet-admin:$2" . >/dev/null
            for n in karryam-admin product-integration-core cfmeet-admin; do docker push -q "127.0.0.1:5000/$n:$2" >/dev/null; done
          }
          digest() { docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "127.0.0.1:5000/$1:$2" | grep -m1 '^127.0.0.1:5000/'; }
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          build "$GITHUB_SHA" r1
          sha2="$(printf '%s' "$GITHUB_SHA" | rev)"
          # Release 2 = same code, different release identity (for the rollback rehearsal).
          docker build -q --label "org.opencontainers.image.revision=$sha2" --label "rehearsal=r2" -f services/karryam-admin/Dockerfile -t 127.0.0.1:5000/karryam-admin:r2 . >/dev/null
          docker build -q --label "org.opencontainers.image.revision=$sha2" --label "rehearsal=r2" -f services/product-integration-core/Dockerfile -t 127.0.0.1:5000/product-integration-core:r2 . >/dev/null
          docker build -q --label "org.opencontainers.image.revision=$sha2" --label "rehearsal=r2" -f services/cfmeet-admin/Dockerfile -t 127.0.0.1:5000/cfmeet-admin:r2 . >/dev/null
          for n in karryam-admin product-integration-core cfmeet-admin; do docker push -q "127.0.0.1:5000/$n:r2" >/dev/null; done
          {
            echo "KA1=$(digest karryam-admin r1)"; echo "PIC1=$(digest product-integration-core r1)"; echo "CM1=$(digest cfmeet-admin r1)"
            echo "KA2=$(digest karryam-admin r2)"; echo "PIC2=$(digest product-integration-core r2)"; echo "CM2=$(digest cfmeet-admin r2)"
            echo "SHA2=$sha2"
          } | tee -a "$GITHUB_ENV"
      - name: Stand-ins for the existing HQ database and Central Admin API
        run: |
          set -euo pipefail
          docker run -d --name rehearsal-hq-db -e POSTGRES_PASSWORD="$(openssl rand -hex 16)" -e POSTGRES_DB=cosmicforge_admin postgres:16-alpine >/dev/null
          for i in $(seq 1 30); do docker exec rehearsal-hq-db pg_isready -q -h 127.0.0.1 -U postgres && break; sleep 2; done
      - name: prepare-host (networks, socket dirs, config dirs, DB-A attachment, DOCKER-USER rules)
        run: |
          set -euo pipefail
          ops prepare-host
          sudo iptables -S DOCKER-USER | tee "$PA_LOGS/docker-user.txt"
          grep -q 'cf-product-admin' "$PA_LOGS/docker-user.txt"
          # Idempotent.
          ops prepare-host >/dev/null
          for n in cf-staging-hq-private cf-staging-admin-private cf-staging-karryam-bridge cf-staging-karryam-admin-db cf-staging-cfmeet-admin-db; do test "$(docker network inspect -f '{{.Internal}}' "$n")" = true; done
          # The CF Meet Bridge network is the one non-internal network, behind the exact egress allowlist.
          test "$(docker network inspect -f '{{.Internal}}' cf-staging-cfmeet-bridge)" = false
          grep -Eq -- '-A DOCKER-USER -s 10.231.14.0/28 -d 10.250.0.1/32 -p tcp( -m tcp)? --dport 8460 ' "$PA_LOGS/docker-user.txt"
          grep -q -- '-A DOCKER-USER -s 10.231.14.0/28 -m comment --comment cf-product-admin -j DROP' "$PA_LOGS/docker-user.txt"
          sudo iptables -S INPUT | grep -q -- '-A INPUT -s 10.231.14.0/28 -m comment --comment cf-product-admin -j DROP'
          grep -q 'present: exact rule set already in place' "$PA_LOGS/prepare-host.log"
          test "$(stat -c '%a %u %g' "$PA_HOST_ROOT/run/cfmeet-admin")" = "750 10003 10003"
          # Invalid tunnel endpoints are refused before anything changes: CGNAT 100.64/10, public, inside a cf-staging subnet.
          for bad in 100.64.0.1 1.1.1.1 10.231.14.10; do
            if PA_CM_BRIDGE_ADDRESS="$bad" ops prepare-host; then echo "::error::prepare-host accepted PA_CM_BRIDGE_ADDRESS=$bad"; exit 1; fi
          done
          # Re-pointing the tunnel address replaces the allowlist exactly (no stale rule survives), then back.
          PA_CM_BRIDGE_ADDRESS=10.250.0.5 ops prepare-host >/dev/null
          if sudo iptables -S DOCKER-USER | grep -q -- '-d 10.250.0.1/32'; then echo "::error::stale allowlist rule for the old bridge address"; exit 1; fi
          sudo iptables -S DOCKER-USER | grep -Eq -- '-d 10.250.0.5/32 -p tcp( -m tcp)? --dport 8460'
          ops prepare-host >/dev/null
          if sudo iptables -S DOCKER-USER | grep -q -- '10.250.0.5/32'; then echo "::error::stale allowlist rule after restoring the bridge address"; exit 1; fi
          # Karryam's source-owned Bridge (stand-in) joins its private network with a fixed address; the API stand-in mounts the PIC socket read-only.
          docker run -d --name rehearsal-bridge --network cf-staging-karryam-bridge --ip 10.231.12.10 node:22-alpine node -e "require('net').createServer(s=>s.end()).listen(8110)" >/dev/null
          docker run -d --name rehearsal-api -v "$PA_HOST_ROOT/run/pic:/run/cosmicforge/pic:ro" node:22-alpine node -e "setInterval(()=>{},1<<30)" >/dev/null
      - name: CF Meet Bridge tunnel stand-in (network namespace peer behind a veth, like a WireGuard peer behind wg0)
        run: |
          set -euo pipefail
          # The real Bridge is on CF Meet's host behind a WireGuard tunnel: a routed L3 interface with one peer.
          # A docker network cannot stand in for it (Docker's inter-network isolation would block the flow for
          # the wrong reason), so the peer is a network namespace behind a veth pair: traffic from
          # cf-staging-cfmeet-bridge is forwarded out of a non-Docker interface and masqueraded to the HQ
          # tunnel address, exactly as with wg0. The peer listens on 8460 (bridge) and 8461 (any other port).
          sudo ip netns add cm-peer
          sudo ip link add cm-tun0 type veth peer name cm-tun1
          sudo ip link set cm-tun1 netns cm-peer
          sudo ip addr add 10.250.0.2/30 dev cm-tun0
          sudo ip link set cm-tun0 up
          sudo ip netns exec cm-peer ip addr add 10.250.0.1/30 dev cm-tun1
          sudo ip netns exec cm-peer ip link set cm-tun1 up
          sudo ip netns exec cm-peer ip link set lo up
          sudo ip netns exec cm-peer nohup python3 -c '
          import socket, threading
          def serve(port):
              s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("10.250.0.1", port)); s.listen(16)
              while True:
                  c, _ = s.accept(); c.close()
          for p in (8460, 8461): threading.Thread(target=serve, args=(p,)).start()
          ' >/dev/null 2>&1 &
          # The peer really listens on both ports (from the host, which is outside the container allowlist).
          for i in $(seq 1 20); do timeout 2 bash -c '</dev/tcp/10.250.0.1/8460' 2>/dev/null && timeout 2 bash -c '</dev/tcp/10.250.0.1/8461' 2>/dev/null && break; sleep 1; done
          timeout 2 bash -c '</dev/tcp/10.250.0.1/8460'
          timeout 2 bash -c '</dev/tcp/10.250.0.1/8461'

      - name: Deploy disabled-by-default (release 1)
        run: |
          set -euo pipefail
          sudo "$(command -v node)" infrastructure/product-admin/release/rehearsal-fixtures.mjs --config-root "$PA_CONFIG_ROOT" --out "$PA_OUT" --mode disabled --release-sha "$GITHUB_SHA"
          has() { grep -q "PA_CHECK {\"id\":\"$1\",\"status\":\"$2\"" "$PA_LOGS/deploy.log" || { echo "::error::expected $1=$2"; exit 1; }; }
          # (a) CF Meet Admin is optional: no PA_CM_IMAGE and no cfmeet-admin.env -> PIC + Karryam exactly as before.
          sudo mv "$PA_CONFIG_ROOT/cfmeet-admin.env" "$RUNNER_TEMP/cfmeet-admin.env.hold"
          ops preflight
          PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy
          grep -q 'CF Meet Admin not part of this release (no PA_CM_IMAGE, no cfmeet-admin.env)' "$PA_LOGS/deploy.log"
          for c in images_match_tested_digests containers_running_non_root no_published_ports network_membership_matches_policy socket_permissions health_live health_ready_expected unauthenticated_refused pic_to_karryam_socket product_admin_sockets_isolated hq_gateway_socket_reachable network_flows bridge_network_reachable_only_from_karryam; do has "$c" PASS; done
          for c in pic_to_cfmeet_socket bridge_network_reachable_only_from_cfmeet; do has "$c" SKIPPED_NOT_DEPLOYED; done
          grep -q '"detail":"ready PIC 503 (expected 503), Karryam Admin 503 (expected 503)"' "$PA_LOGS/deploy.log"
          test -z "$(docker ps -a --filter label=com.docker.compose.project=cf-product-admin-staging --filter name=cfmeet --format '{{.Names}}')" || { echo "::error::a CF Meet container was created in a Karryam-only release"; exit 1; }
          if sudo grep -q '^CFMEET_ADMIN_IMAGE=' "$PA_HOST_ROOT/release/images.env"; then echo "::error::Karryam-only release recorded a CF Meet image"; exit 1; fi
          # Its S2 evidence treats the CF Meet check as not applicable (never PASS) and still passes on the Karryam checks.
          node infrastructure/product-admin/release/collect-evidence.mjs --stage S2 --sha "$GITHUB_SHA" --environment rehearsal --log "$PA_LOGS/deploy.log" --out "$RUNNER_TEMP/s2-karryam-only.json"
          node -e 'const c=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).checks; const s=Object.fromEntries(c.map((x)=>[x.id,x.status])); if (s.pic_to_cfmeet_socket!=="NOT_APPLICABLE" || s.pic_to_karryam_socket!=="PASS") { console.error(s); process.exit(1); }' "$RUNNER_TEMP/s2-karryam-only.json"
          cp "$PA_LOGS/deploy.log" "$PA_LOGS/deploy-karryam-only.log"; : > "$PA_LOGS/deploy.log"
          # (b) Partial CF Meet setup is refused before anything changes: PA_CM_IMAGE without cfmeet-admin.env.
          if PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy; then echo "::error::PA_CM_IMAGE without cfmeet-admin.env was accepted"; exit 1; fi
          grep -q 'PA_CM_IMAGE is set but .*cfmeet-admin.env is missing' "$PA_LOGS/deploy.log"
          test -z "$(docker ps -a --filter label=com.docker.compose.project=cf-product-admin-staging --filter name=cfmeet --format '{{.Names}}')"
          : > "$PA_LOGS/deploy.log"
          sudo mv "$RUNNER_TEMP/cfmeet-admin.env.hold" "$PA_CONFIG_ROOT/cfmeet-admin.env"
          # (b2) The CF Meet Bridge tunnel endpoint is required and must be RFC 1918, outside every cf-staging subnet.
          for bad in "" 100.64.0.1 10.231.14.10; do
            if PA_CM_BRIDGE_ADDRESS="$bad" PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy; then echo "::error::deploy accepted PA_CM_BRIDGE_ADDRESS='$bad'"; exit 1; fi
          done
          grep -q 'PA_CM_BRIDGE_ADDRESS (RFC 1918 tunnel address of the CF Meet host' "$PA_LOGS/deploy.log"
          # A tunnel address the firewall was not prepared for is refused too.
          if PA_CM_BRIDGE_ADDRESS=10.250.0.9 PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy; then echo "::error::deploy accepted a bridge address without its egress allowlist"; exit 1; fi
          grep -q 'egress allowlist for 10.250.0.9:8460 is not in place' "$PA_LOGS/deploy.log"
          test -z "$(docker ps -a --filter label=com.docker.compose.project=cf-product-admin-staging --filter name=cfmeet --format '{{.Names}}')"
          : > "$PA_LOGS/deploy.log"
          # (c) Full release with CF Meet Admin.
          ops preflight
          PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy
          grep -q 'CF Meet Admin is part of this release' "$PA_LOGS/deploy.log"
          has() { grep -q "PA_CHECK {\"id\":\"$1\",\"status\":\"$2\"" "$PA_LOGS/deploy.log" || { echo "::error::expected $1=$2"; exit 1; }; }
          for c in images_match_tested_digests containers_running_non_root no_published_ports network_membership_matches_policy socket_permissions health_live health_ready_expected unauthenticated_refused pic_to_karryam_socket pic_to_cfmeet_socket product_admin_sockets_isolated hq_gateway_socket_reachable network_flows bridge_network_reachable_only_from_karryam bridge_network_reachable_only_from_cfmeet; do has "$c" PASS; done
          grep -q 'ready PIC 503 (expected 503), Karryam Admin 503 (expected 503), CF Meet Admin 503' "$PA_LOGS/deploy.log"
          test "$(docker exec cf-product-admin-staging-cfmeet-admin-1 id -u)" = 10003
          grep -q 'PA_CHECK {"id":"bridge_network_reachable_only_from_cfmeet","status":"PASS","detail":"CF Meet Admin reaches 10.250.0.1:8460 over the tunnel' "$PA_LOGS/deploy.log"
          sudo grep -qx 'PA_CM_BRIDGE_ADDRESS=10.250.0.1' "$PA_HOST_ROOT/release/images.env"
          # Independent probes of the egress allowlist (not via the host script).
          probe() { docker exec "$1" node -e 'const s=require("net").connect({host:process.argv[1],port:Number(process.argv[2]),timeout:3000});s.on("connect",()=>{console.log("OPEN");process.exit(0)});s.on("timeout",()=>{console.log("TIMEOUT");process.exit(0)});s.on("error",(e)=>{console.log(e.code||"ERROR");process.exit(0)})' "$2" "$3" 2>/dev/null || echo ERROR; }
          expect() { local got; got="$(probe "$1" "$2" "$3")"; if [[ "$4" == open ]]; then [[ "$got" == OPEN ]] || { echo "::error::$1 -> $2:$3 expected open, got $got"; exit 1; }; else [[ "$got" != OPEN ]] || { echo "::error::$1 -> $2:$3 expected closed"; exit 1; }; fi; echo "$1 -> $2:$3 $got"; }
          CM=cf-product-admin-staging-cfmeet-admin-1
          expect "$CM" 10.250.0.1 8460 open
          expect "$CM" 10.250.0.1 8461 closed
          expect "$CM" 10.250.0.2 22 closed
          expect "$CM" 1.1.1.1 443 closed
          expect "$CM" 1.1.1.1 53 closed
          expect "$CM" 10.231.14.1 22 closed
          expect cf-product-admin-staging-karryam-admin-1 10.250.0.1 8460 closed
          expect cf-product-admin-staging-product-integration-core-1 10.250.0.1 8460 closed
          expect rehearsal-api 10.250.0.1 8460 closed
          if docker ps --filter label=com.docker.compose.project=cf-product-admin-staging --format '{{.Ports}}' | grep -q -- '->'; then echo "::error::a host port is published"; exit 1; fi
      - name: Database roles, audit, preview, verified backup and migrations
        run: |
          set -euo pipefail
          sudo "$(command -v node)" infrastructure/product-admin/release/rehearsal-fixtures.mjs --config-root "$PA_CONFIG_ROOT" --out "$PA_OUT" --mode enabled --release-sha "$GITHUB_SHA"
          # Roles: the exact operator templates, on DB-A and the dedicated DB-B.
          docker exec -i rehearsal-hq-db psql -U postgres -d cosmicforge_admin -v ON_ERROR_STOP=1 $(sudo cat "$PA_OUT/db-a.psqlvars") -f - < infrastructure/product-admin/staging/db-a-roles.sql
          docker exec -i cf-product-admin-staging-karryam-admin-db-1 sh -c 'PGPASSWORD="$(cat /run/secrets/karryam-admin-db/postgres-password)" psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 "$@" -f -' _ $(sudo cat "$PA_OUT/db-b.psqlvars") < infrastructure/product-admin/staging/db-b-roles.sql
          docker exec -i cf-product-admin-staging-cfmeet-admin-db-1 sh -c 'PGPASSWORD="$(cat /run/secrets/cfmeet-admin-db/postgres-password)" psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 "$@" -f -' _ $(sudo cat "$PA_OUT/cfmeet-db.psqlvars") < infrastructure/product-admin/staging/cfmeet-admin-db-roles.sql
          ops db-audit
          grep -q 'PA_CHECK {"id":"db_roles_separated","status":"PENDING_EXTERNAL".*PUBLIC still holds CONNECT' "$PA_LOGS/db-audit.log"
          # Operator decision simulated: explicit grants, then revoke PUBLIC CONNECT.
          docker exec rehearsal-hq-db psql -U postgres -d cosmicforge_admin -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE cosmicforge_admin TO postgres" -c "REVOKE CONNECT ON DATABASE cosmicforge_admin FROM PUBLIC"
          ops db-audit
          grep -q 'PA_CHECK {"id":"db_roles_separated","status":"PASS"' "$PA_LOGS/db-audit.log"
          ops migrate-preview
          if PA_RELEASE_SHA="$GITHUB_SHA" ops migrate-apply; then echo "::error::migrations ran without a verified backup"; exit 1; fi
          grep -q 'no verified, restorable backup' "$PA_LOGS/migrate-apply.log"
          ops backup
          grep -q 'PA_CHECK {"id":"backup_restorable","status":"PASS"' "$PA_LOGS/backup.log"
          ops migrate-apply
          grep -q 'PA_CHECK {"id":"migration_apply_pic","status":"PASS"' "$PA_LOGS/migrate-apply.log"
          grep -q 'PA_CHECK {"id":"migration_apply_karryam","status":"PASS"' "$PA_LOGS/migrate-apply.log"
          grep -q 'PA_CHECK {"id":"migration_apply_cfmeet","status":"PASS"' "$PA_LOGS/migrate-apply.log"
          grep -q 'db-cfmeet-cfmeet_admin.dump' "$PA_LOGS/backup.log"
          # The runtime roles cannot change the schema.
          if docker exec rehearsal-hq-db sh -c 'psql -U pic_runtime -d cosmicforge_admin -c "CREATE TABLE hq_integration.x (id int)"' 2>/dev/null; then echo "::error::runtime role created a table"; exit 1; fi
      - name: Enabled deploy (release 1), preflight and probes
        run: |
          set -euo pipefail
          : > "$PA_LOGS/deploy.log"
          ops preflight
          PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy
          grep -q 'ready PIC 200 (expected 200), Karryam Admin 200 (expected 200), CF Meet Admin 200 (expected 200)' "$PA_LOGS/deploy.log"
          grep -q 'PA_CHECK {"id":"unauthenticated_refused","status":"PASS","detail":"PIC 401, Karryam Admin 401, CF Meet Admin 401' "$PA_LOGS/deploy.log"
          ops network-probe
          ops status
      - name: Release state S0-S2 from collected evidence (environment rehearsal)
        run: |
          set -euo pipefail
          r=infrastructure/product-admin/release
          st="$PA_LOGS/state"
          node $r/release-state.mjs init --dir "$st" --sha "$GITHUB_SHA" --environment rehearsal --actor ci-rehearsal
          # S0 in a rehearsal is this workflow's own static and Nginx jobs (labelled; never staging evidence).
          node -e 'const s=require("./infrastructure/product-admin/release/stages.json").stages[0];process.stdout.write(JSON.stringify(s.automated_checks.map(id=>({id,status:"PASS",detail:"rehearsal: static+nginx jobs of this run"}))))' > "$RUNNER_TEMP/s0.json"
          node $r/release-state.mjs begin --dir "$st" --stage S0 --actor ci-rehearsal
          node $r/collect-evidence.mjs --stage S0 --sha "$GITHUB_SHA" --environment rehearsal --extra "$RUNNER_TEMP/s0.json" --out "$RUNNER_TEMP/s0-evidence.json"
          node $r/release-state.mjs complete --dir "$st" --stage S0 --evidence "$RUNNER_TEMP/s0-evidence.json" --actor ci-rehearsal
          printf '[{"id":"db_roles_created","ref":"rehearsal:db-a-roles.sql,db-b-roles.sql,cfmeet-admin-db-roles.sql","by":"ci-rehearsal"},{"id":"public_connect_revoked","ref":"rehearsal:db-audit","by":"ci-rehearsal"},{"id":"nginx_snippet_installed","ref":"rehearsal:nginx-job","by":"ci-rehearsal"}]' > "$RUNNER_TEMP/op.json"
          printf '{"by":"ci-rehearsal","confirm":"APPLY_STAGING_PRODUCT_ADMIN_CHANGES"}' > "$RUNNER_TEMP/auth.json"
          node $r/release-state.mjs begin --dir "$st" --stage S1 --actor ci-rehearsal
          node $r/collect-evidence.mjs --stage S1 --sha "$GITHUB_SHA" --environment rehearsal --log "$PA_LOGS/preflight.log" --log "$PA_LOGS/db-audit.log" --log "$PA_LOGS/backup.log" --log "$PA_LOGS/migrate-preview.log" --log "$PA_LOGS/migrate-apply.log" \
            --probe-report "$RUNNER_TEMP/probe/product-admin-ingress-probe.json" --operator-evidence "$RUNNER_TEMP/op.json" --authorization "$RUNNER_TEMP/auth.json" --out "$RUNNER_TEMP/s1-evidence.json"
          node $r/release-state.mjs complete --dir "$st" --stage S1 --evidence "$RUNNER_TEMP/s1-evidence.json" --actor ci-rehearsal
          node $r/release-state.mjs begin --dir "$st" --stage S2 --actor ci-rehearsal
          node $r/collect-evidence.mjs --stage S2 --sha "$GITHUB_SHA" --environment rehearsal --log "$PA_LOGS/deploy.log" --authorization "$RUNNER_TEMP/auth.json" --out "$RUNNER_TEMP/s2-evidence.json"
          node $r/release-state.mjs complete --dir "$st" --stage S2 --evidence "$RUNNER_TEMP/s2-evidence.json" --actor ci-rehearsal
          # S3 cannot pass without a real Bridge enrollment: it stays blocked.
          node $r/release-state.mjs begin --dir "$st" --stage S3 --actor ci-rehearsal
          printf '[{"id":"karryam_config_valid_staging","status":"PASS"},{"id":"bridge_client_identity_current","status":"PENDING_EXTERNAL"},{"id":"bridge_tls13_mtls_reachable","status":"PENDING_EXTERNAL"},{"id":"manifest_signer_enrolled","status":"PASS"},{"id":"capability_discovery_read_only","status":"PENDING_EXTERNAL"},{"id":"unauthorized_scope_denied","status":"PENDING_EXTERNAL"}]' > "$RUNNER_TEMP/s3.json"
          node $r/collect-evidence.mjs --stage S3 --sha "$GITHUB_SHA" --environment rehearsal --extra "$RUNNER_TEMP/s3.json" --out "$RUNNER_TEMP/s3-evidence.json"
          rc=0; node $r/release-state.mjs complete --dir "$st" --stage S3 --evidence "$RUNNER_TEMP/s3-evidence.json" --actor ci-rehearsal || rc=$?
          test "$rc" = 3
          node $r/release-state.mjs status --dir "$st" | tee "$PA_LOGS/release-status.json"
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).stages; for (const [k,v] of Object.entries({S0:"PASSED",S1:"PASSED",S2:"PASSED",S3:"BLOCKED_EXTERNAL",S4:"PENDING"})) if (s[k].status!==v) { console.error(k, s[k]); process.exit(1); }' "$PA_LOGS/release-status.json"
          if node $r/release-state.mjs begin --dir "$st" --stage S4 --actor ci-rehearsal; then echo "::error::S4 began while S3 is blocked"; exit 1; fi
          node $r/release-state.mjs verify --dir "$st"
      - name: Second release, rollback to the recorded digests, refused bad configuration, emergency disable
        run: |
          set -euo pipefail
          : > "$PA_LOGS/deploy.log"
          PA_PIC_IMAGE="$PIC2" PA_KA_IMAGE="$KA2" PA_CM_IMAGE="$CM2" PA_RELEASE_SHA="$SHA2" ops deploy
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-karryam-admin-1)" = "$KA2"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-cfmeet-admin-1)" = "$CM2"
          # A release whose label does not match its commit is refused before anything changes.
          if PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$SHA2" ops deploy; then echo "::error::label/commit mismatch accepted"; exit 1; fi
          if PA_PIC_IMAGE="$PIC2" PA_KA_IMAGE="$KA2" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$SHA2" ops deploy; then echo "::error::CF Meet Admin label/commit mismatch accepted"; exit 1; fi
          # Image references are checked per role: a Karryam digest is not a CF Meet Admin image.
          if PA_PIC_IMAGE="$PIC2" PA_KA_IMAGE="$KA2" PA_CM_IMAGE="$KA2" PA_RELEASE_SHA="$SHA2" ops deploy; then echo "::error::a Karryam image was accepted as CF Meet Admin"; exit 1; fi
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-karryam-admin-1)" = "$KA2"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-cfmeet-admin-1)" = "$CM2"
          ops rollback
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-karryam-admin-1)" = "$KA1"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-cfmeet-admin-1)" = "$CM1"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-product-integration-core-1)" = "$PIC1"
          grep -q 'ROLLED_BACK to' "$PA_LOGS/rollback.log"
          # Invalid operator configuration: refused inside the image, running release untouched.
          sudo cp "$PA_CONFIG_ROOT/karryam-admin.env" "$RUNNER_TEMP/ka.env.bak"
          sudo sed -i '/^KARRYAM_ADMIN_DATABASE_URL=/d' "$PA_CONFIG_ROOT/karryam-admin.env"
          if PA_PIC_IMAGE="$PIC2" PA_KA_IMAGE="$KA2" PA_CM_IMAGE="$CM2" PA_RELEASE_SHA="$SHA2" ops deploy; then echo "::error::invalid configuration deployed"; exit 1; fi
          grep -q 'Karryam Admin configuration is invalid; nothing was changed' "$PA_LOGS/deploy.log"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-karryam-admin-1)" = "$KA1"
          sudo cp "$RUNNER_TEMP/ka.env.bak" "$PA_CONFIG_ROOT/karryam-admin.env"
          # The same for an invalid CF Meet Admin configuration.
          sudo cp "$PA_CONFIG_ROOT/cfmeet-admin.env" "$RUNNER_TEMP/cm.env.bak"
          sudo sed -i '/^CFMEET_ADMIN_DATABASE_URL=/d' "$PA_CONFIG_ROOT/cfmeet-admin.env"
          if PA_PIC_IMAGE="$PIC2" PA_KA_IMAGE="$KA2" PA_CM_IMAGE="$CM2" PA_RELEASE_SHA="$SHA2" ops deploy; then echo "::error::invalid CF Meet Admin configuration deployed"; exit 1; fi
          grep -q 'CF Meet Admin configuration is invalid; nothing was changed' "$PA_LOGS/deploy.log"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-cfmeet-admin-1)" = "$CM1"
          sudo cp "$RUNNER_TEMP/cm.env.bak" "$PA_CONFIG_ROOT/cfmeet-admin.env"
          # Emergency disable keeps DB-B, the CF Meet Admin database, their data and all evidence.
          ops disable
          test "$(docker inspect -f '{{.State.Status}}' cf-product-admin-staging-karryam-admin-1)" = exited
          test "$(docker inspect -f '{{.State.Status}}' cf-product-admin-staging-cfmeet-admin-1)" = exited
          test "$(docker inspect -f '{{.State.Status}}' cf-product-admin-staging-karryam-admin-db-1)" = running
          test "$(docker inspect -f '{{.State.Status}}' cf-product-admin-staging-cfmeet-admin-db-1)" = running
          docker exec cf-product-admin-staging-karryam-admin-db-1 sh -c 'PGPASSWORD="$(cat /run/secrets/karryam-admin-db/postgres-password)" psql -h 127.0.0.1 -U postgres -d karryam_admin -tAc "SELECT count(*) FROM karryam_admin.schema_migrations"' | grep -Eq '^[1-9]'
          docker exec cf-product-admin-staging-cfmeet-admin-db-1 sh -c 'PGPASSWORD="$(cat /run/secrets/cfmeet-admin-db/postgres-password)" psql -h 127.0.0.1 -U postgres -d cfmeet_admin -tAc "SELECT count(*) FROM cfmeet_admin.schema_migrations"' | grep -Eq '^[1-9]'
          node infrastructure/product-admin/release/release-state.mjs rollback --dir "$PA_LOGS/state" --stage S2 --reason "rehearsal emergency disable" --actor ci-rehearsal
          node infrastructure/product-admin/release/release-state.mjs status --dir "$PA_LOGS/state" | grep -q '"S2":{"status":"ROLLED_BACK"'
          node infrastructure/product-admin/release/release-state.mjs verify --dir "$PA_LOGS/state"
      - name: Optional CF Meet Admin - a Karryam-only release, and rollback to a release without CF Meet Admin
        run: |
          set -euo pipefail
          st() { docker inspect -f '{{.State.Status}}' "$1" 2>/dev/null || echo absent; }
          : > "$PA_LOGS/deploy.log"
          # cfmeet-admin.env exists but PA_CM_IMAGE is not set: Karryam + PIC only, CF Meet stopped, logged as skipped.
          PA_PIC_IMAGE="$PIC2" PA_KA_IMAGE="$KA2" PA_RELEASE_SHA="$SHA2" ops deploy
          grep -q 'CF Meet Admin skipped: .*cfmeet-admin.env exists but PA_CM_IMAGE is not set' "$PA_LOGS/deploy.log"
          test "$(st cf-product-admin-staging-cfmeet-admin-1)" != running
          test "$(st cf-product-admin-staging-cfmeet-admin-db-1)" != running
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-karryam-admin-1)" = "$KA2"
          # A full release on top of it, then roll back to the Karryam-only release.
          PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy
          test "$(st cf-product-admin-staging-cfmeet-admin-1)" = running
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-cfmeet-admin-1)" = "$CM1"
          : > "$PA_LOGS/rollback.log"
          ops rollback
          grep -q 'ROLLED_BACK to' "$PA_LOGS/rollback.log"
          grep -q 'PA_CHECK {"id":"pic_to_cfmeet_socket","status":"SKIPPED_NOT_DEPLOYED"' "$PA_LOGS/rollback.log"
          test "$(docker inspect -f '{{.Config.Image}}' cf-product-admin-staging-karryam-admin-1)" = "$KA2"
          test "$(st cf-product-admin-staging-cfmeet-admin-1)" != running
          if sudo grep -q '^CFMEET_ADMIN_IMAGE=' "$PA_HOST_ROOT/release/images.env"; then echo "::error::rollback target should have no CF Meet image"; exit 1; fi
          # Later operations derive the decision from the release: CF Meet migrations are skipped, not failed.
          : > "$PA_LOGS/migrate-preview.log"
          ops migrate-preview
          grep -q 'PA_CHECK {"id":"migration_preview_cfmeet","status":"SKIPPED_NOT_DEPLOYED"' "$PA_LOGS/migrate-preview.log"
          grep -q 'PA_CHECK {"id":"migration_preview_karryam","status":"PASS"' "$PA_LOGS/migrate-preview.log"
      - name: Image digests evidence
        if: always()
        run: |
          printf '{"report":"product-admin-image-digests","environment":"rehearsal","source_sha":"%s","generated_at":"%s","images":{"karryam-admin":"%s","cfmeet-admin":"%s","product-integration-core":"%s"},"note":"local rehearsal registry; staging digests are recorded by product-admin-staging-ops"}\n' \
            "$GITHUB_SHA" "$(date -u +%FT%TZ)" "${KA1:-}" "${CM1:-}" "${PIC1:-}" > "$PA_LOGS/product-admin-image-digests.json"
          sudo chown -R "$(id -u):$(id -g)" "$PA_LOGS" || true
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}} {{.Image}}'
          for c in $(docker ps -a --filter label=com.docker.compose.project=cf-product-admin-staging --format '{{.Names}}'); do echo "== $c"; docker logs --tail 60 "$c" 2>&1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-admin-release-rehearsal
          path: _rehearsal/
          if-no-files-found: warn

  rehearsal-same-host:
    name: Same-host CF Meet Bridge rehearsal (internal network, stand-in relay at .2, exact membership, mode switch)
    needs: [static, nginx]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PA_REHEARSAL: "1"
      PA_HQ_DB_CONTAINER: rehearsal-hq-db
      PA_API_CONTAINER: rehearsal-api
      PA_BRIDGE_CONTAINER: rehearsal-bridge
      PA_BRIDGE_ADDRESS: 10.231.12.10
      # The default transport, set explicitly: HQ staging and CF Meet production share one VPS. CF Meet's
      # TCP passthrough relay is a container on the internal cf-staging-cfmeet-bridge at .2; no address variable.
      PA_CM_BRIDGE_MODE: same-host
      PA_CM_RELAY_CONTAINER: cfmeet-admin-bridge-hq-relay
      # Stand-in CF Meet operational database on a CF Meet-owned network: must stay closed from CF Meet Admin.
      PA_CM_DENY_TARGETS: 10.232.0.5:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rehearsal layout and ops wrapper
        run: |
          set -euo pipefail
          echo "PA_HOST_ROOT=$RUNNER_TEMP/host" >> "$GITHUB_ENV"
          echo "PA_CONFIG_ROOT=$RUNNER_TEMP/etc" >> "$GITHUB_ENV"
          echo "PA_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "PA_LOGS=$GITHUB_WORKSPACE/_rehearsal_same_host" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/_rehearsal_same_host"
          cat > "$RUNNER_TEMP/ops" <<'SH'
          #!/usr/bin/env bash
          # Runs the real host script as root, like the VPS workflow does.
          set -o pipefail
          op="$1"; shift
          sudo env PA_REHEARSAL=1 PA_HOST_ROOT="$PA_HOST_ROOT" PA_CONFIG_ROOT="$PA_CONFIG_ROOT" PA_HQ_DB_CONTAINER="$PA_HQ_DB_CONTAINER" \
            PA_API_CONTAINER="$PA_API_CONTAINER" PA_BRIDGE_CONTAINER="$PA_BRIDGE_CONTAINER" PA_BRIDGE_ADDRESS="$PA_BRIDGE_ADDRESS" \
            PA_CM_BRIDGE_MODE="${PA_CM_BRIDGE_MODE:-same-host}" PA_CM_BRIDGE_ADDRESS="${PA_CM_BRIDGE_ADDRESS:-}" PA_CM_BRIDGE_PORT="${PA_CM_BRIDGE_PORT:-8460}" \
            PA_CM_RELAY_CONTAINER="$PA_CM_RELAY_CONTAINER" PA_CM_DENY_TARGETS="${PA_CM_DENY_TARGETS:-}" \
            PA_PIC_IMAGE="${PA_PIC_IMAGE:-}" PA_KA_IMAGE="${PA_KA_IMAGE:-}" PA_CM_IMAGE="${PA_CM_IMAGE:-}" PA_RELEASE_SHA="${PA_RELEASE_SHA:-}" PA_RUN_ID="${GITHUB_RUN_ID}-${op}-$RANDOM" "$@" \
            bash "$GITHUB_WORKSPACE/infrastructure/product-admin/release/pa-staging-ops.sh" "$op" 2>&1 | tee -a "$PA_LOGS/$op.log"
          SH
          chmod +x "$RUNNER_TEMP/ops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # Probe helpers shared by the steps below (never via the host script).
          cat > "$RUNNER_TEMP/probe" <<'SH'
          #!/usr/bin/env bash
          # probe <container> <host> <port>: TCP connect result (OPEN, TIMEOUT or an error code).
          docker exec "$1" node -e 'const s=require("net").connect({host:process.argv[1],port:Number(process.argv[2]),timeout:3000});s.on("connect",()=>{console.log("OPEN");process.exit(0)});s.on("timeout",()=>{console.log("TIMEOUT");process.exit(0)});s.on("error",(e)=>{console.log(e.code||"ERROR");process.exit(0)})' "$2" "$3" 2>/dev/null || echo ERROR
          SH
          cat > "$RUNNER_TEMP/banner" <<'SH'
          #!/usr/bin/env bash
          # banner <docker run|exec args...> -- <host> <port>: what the relay says (relay-ok for an admitted source).
          # Output: the data received (relay-ok); CLOSED_WITHOUT_DATA or OPEN_NO_DATA after a TCP connect;
          # NO_CONNECTION(<reason>) when no TCP connection was ever established.
          js='const s=require("net").connect({host:process.argv[1],port:Number(process.argv[2]),timeout:3000});let d="",c=false;const done=(x)=>{console.log(x);process.exit(0)};s.on("connect",()=>{c=true});s.on("data",(b)=>{d+=b});s.on("close",()=>done(d.trim()||(c?"CLOSED_WITHOUT_DATA":"NO_CONNECTION(closed)")));s.on("timeout",()=>done(d.trim()||(c?"OPEN_NO_DATA":"NO_CONNECTION(TIMEOUT)")));s.on("error",(e)=>done(d.trim()||(c?"CLOSED_WITHOUT_DATA":"NO_CONNECTION("+(e.code||"ERROR")+")")))'
          args=(); while [[ "$1" != -- ]]; do args+=("$1"); shift; done; shift
          docker "${args[@]}" node -e "$js" "$1" "$2" 2>/dev/null || echo ERROR
          SH
          chmod +x "$RUNNER_TEMP/probe" "$RUNNER_TEMP/banner"
      - name: Build release images (revision label = this commit) and push to a local registry for real digests
        run: |
          set -euo pipefail
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2 >/dev/null
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          for n in karryam-admin product-integration-core cfmeet-admin; do
            docker build -q --label "org.opencontainers.image.revision=$GITHUB_SHA" -f "services/$n/Dockerfile" -t "127.0.0.1:5000/$n:r1" . >/dev/null
            docker push -q "127.0.0.1:5000/$n:r1" >/dev/null
          done
          digest() { docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "127.0.0.1:5000/$1:r1" | grep -m1 '^127.0.0.1:5000/'; }
          { echo "KA1=$(digest karryam-admin)"; echo "PIC1=$(digest product-integration-core)"; echo "CM1=$(digest cfmeet-admin)"; } | tee -a "$GITHUB_ENV"
      - name: Stand-ins for the existing HQ database
        run: |
          set -euo pipefail
          docker run -d --name rehearsal-hq-db -e POSTGRES_PASSWORD="$(openssl rand -hex 16)" -e POSTGRES_DB=cosmicforge_admin postgres:16-alpine >/dev/null
          for i in $(seq 1 30); do docker exec rehearsal-hq-db pg_isready -q -h 127.0.0.1 -U postgres && break; sleep 2; done
          docker pull -q node:22-alpine >/dev/null
      - name: prepare-host in same-host mode (internal Bridge network, no egress allowlist)
        run: |
          set -euo pipefail
          ops prepare-host
          ops prepare-host >/dev/null
          grep -q 'present: exact rule set already in place' "$PA_LOGS/prepare-host.log"
          grep -q 'CF Meet Bridge transport same-host: cf-staging-cfmeet-bridge is internal' "$PA_LOGS/prepare-host.log"
          # Every Product Admin network is internal, the CF Meet Bridge network included.
          for n in cf-staging-hq-private cf-staging-admin-private cf-staging-karryam-bridge cf-staging-karryam-admin-db cf-staging-cfmeet-bridge cf-staging-cfmeet-admin-db; do test "$(docker network inspect -f '{{.Internal}}' "$n")" = true; done
          test "$(docker network inspect -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' cf-staging-cfmeet-bridge)" = 10.231.14.0/28
          sudo iptables -S DOCKER-USER | tee "$PA_LOGS/docker-user.txt"
          # No egress allowlist and no subnet-wide drop in DOCKER-USER (they would cut CF Meet Admin off the relay); the subnet never reaches the host.
          if grep -E -- '-(s|d) 10.231.14.0/28 -m comment' "$PA_LOGS/docker-user.txt"; then echo "::error::a subnet-wide DOCKER-USER rule exists in same-host mode"; exit 1; fi
          if grep -E -- '--dport 8460 .*-j RETURN' "$PA_LOGS/docker-user.txt"; then echo "::error::an egress allowlist exists in same-host mode"; exit 1; fi
          sudo iptables -S INPUT | grep -q -- '-A INPUT -s 10.231.14.0/28 -m comment --comment cf-product-admin -j DROP'
          grep -Eq -- '--ctorigdstport 8460 .*-j DROP' "$PA_LOGS/docker-user.txt"
          # Same-host accepts only the relay address; unknown modes are refused; nothing changes.
          for bad in 10.250.0.1 10.231.14.9; do
            if PA_CM_BRIDGE_ADDRESS="$bad" ops prepare-host; then echo "::error::same-host prepare-host accepted PA_CM_BRIDGE_ADDRESS=$bad"; exit 1; fi
          done
          if PA_CM_BRIDGE_MODE=wireguard ops prepare-host; then echo "::error::an unknown transport mode was accepted"; exit 1; fi
          test "$(docker network inspect -f '{{.Internal}}' cf-staging-cfmeet-bridge)" = true
          # Karryam's Bridge stand-in and the API stand-in, exactly as in the tunnel rehearsal.
          docker run -d --name rehearsal-bridge --network cf-staging-karryam-bridge --ip 10.231.12.10 node:22-alpine node -e "require('net').createServer(s=>s.end()).listen(8110)" >/dev/null
          docker run -d --name rehearsal-api -v "$PA_HOST_ROOT/run/pic:/run/cosmicforge/pic:ro" node:22-alpine node -e "setInterval(()=>{},1<<30)" >/dev/null
      - name: Stand-in CF Meet relay at .2 (nginx-stream-like ACL for .3/.4) and a CF Meet operational database
        run: |
          set -euo pipefail
          # CF Meet's own network with an operational database: HQ must never reach it.
          docker network create --internal --subnet 10.232.0.0/28 cm-standin-ops >/dev/null
          docker run -d --name cm-standin-opsdb --network cm-standin-ops --ip 10.232.0.5 node:22-alpine node -e "require('net').createServer(s=>s.end()).listen(5432)" >/dev/null
          # The relay, attached by "CF Meet" with its fixed address and no host port. Like nginx stream allow/deny,
          # TCP is accepted and an unadmitted source is closed without a byte; .3 and .4 get a banner.
          docker run -d --name cfmeet-admin-bridge-hq-relay --network cf-staging-cfmeet-bridge --ip 10.231.14.2 node:22-alpine node -e '
            const ok = new Set(["10.231.14.3", "10.231.14.4"]);
            require("net").createServer((s) => { s.on("error", () => {}); const a = String(s.remoteAddress || "").replace(/^::ffff:/, ""); if (ok.has(a)) s.end("relay-ok\n"); else s.destroy(); }).on("error", (e) => { console.error(e); process.exit(1); }).listen(8460);' >/dev/null
          docker network connect cm-standin-ops cfmeet-admin-bridge-hq-relay
          test -z "$(docker port cfmeet-admin-bridge-hq-relay)"
      - name: Deploy with CF Meet Admin in same-host mode (refusals first, then the release)
        run: |
          set -euo pipefail
          sudo "$(command -v node)" infrastructure/product-admin/release/rehearsal-fixtures.mjs --config-root "$PA_CONFIG_ROOT" --out "$PA_OUT" --mode disabled --release-sha "$GITHUB_SHA"
          none_cm() { test -z "$(docker ps -a --filter label=com.docker.compose.project=cf-product-admin-staging --filter name=cfmeet --format '{{.Names}}')"; }
          # (a) cfmeet-admin.env naming a tunnel address is refused before anything changes.
          echo 'CFMEET_BRIDGE_ADDRESS=10.250.0.1' | sudo tee -a "$PA_CONFIG_ROOT/cfmeet-admin.env" >/dev/null
          if PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy; then echo "::error::a tunnel CFMEET_BRIDGE_ADDRESS was accepted in same-host mode"; exit 1; fi
          grep -q 'CFMEET_BRIDGE_ADDRESS in cfmeet-admin.env (10.250.0.1) differs from PA_CM_BRIDGE_ADDRESS (10.231.14.2)' "$PA_LOGS/deploy.log"
          sudo sed -i '/^CFMEET_BRIDGE_ADDRESS=/d' "$PA_CONFIG_ROOT/cfmeet-admin.env"
          echo 'CFMEET_BRIDGE_ADDRESS=10.231.14.2' | sudo tee -a "$PA_CONFIG_ROOT/cfmeet-admin.env" >/dev/null
          # (b) A tunnel address in same-host mode is refused.
          if PA_CM_BRIDGE_ADDRESS=10.250.0.1 PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy; then echo "::error::deploy accepted a tunnel address in same-host mode"; exit 1; fi
          grep -q 'is not the same-host relay address 10.231.14.2' "$PA_LOGS/deploy.log"
          # (c) Tunnel mode onto the internal network is refused (no silent switch).
          if PA_CM_BRIDGE_MODE=tunnel PA_CM_BRIDGE_ADDRESS=10.250.0.1 PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy; then echo "::error::tunnel deploy accepted on the internal network"; exit 1; fi
          grep -q 'cf-staging-cfmeet-bridge is internal (same-host model)' "$PA_LOGS/deploy.log"
          none_cm
          : > "$PA_LOGS/deploy.log"
          # (d) The release.
          ops preflight
          PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy
          has() { grep -q "PA_CHECK {\"id\":\"$1\",\"status\":\"$2\"" "$PA_LOGS/deploy.log" || { echo "::error::expected $1=$2"; exit 1; }; }
          for c in images_match_tested_digests containers_running_non_root no_published_ports network_membership_matches_policy socket_permissions health_live health_ready_expected unauthenticated_refused pic_to_karryam_socket pic_to_cfmeet_socket product_admin_sockets_isolated network_flows bridge_network_reachable_only_from_karryam bridge_network_reachable_only_from_cfmeet cfmeet_bridge_same_host_boundary; do has "$c" PASS; done
          grep -q '"id":"bridge_network_reachable_only_from_cfmeet","status":"PASS","detail":"CF Meet Admin reaches the same-host relay 10.231.14.2:8460' "$PA_LOGS/deploy.log"
          grep -q '"id":"networks_internal_and_isolated","status":"PASS".*cf-staging-cfmeet-bridge internal (same-host relay 10.231.14.2)' "$PA_LOGS/preflight.log"
          sudo grep -qx 'PA_CM_BRIDGE_MODE=same-host' "$PA_HOST_ROOT/release/images.env"
          sudo grep -qx 'PA_CM_BRIDGE_ADDRESS=10.231.14.2' "$PA_HOST_ROOT/release/images.env"
      - name: Independent proofs (not via the host script)
        run: |
          set -euo pipefail
          CM=cf-product-admin-staging-cfmeet-admin-1; NET=cf-staging-cfmeet-bridge
          expect() { local got; got="$(probe "$1" "$2" "$3")"; if [[ "$4" == open ]]; then [[ "$got" == OPEN ]] || { echo "::error::$1 -> $2:$3 expected open, got $got"; exit 1; }; else [[ "$got" != OPEN ]] || { echo "::error::$1 -> $2:$3 expected closed"; exit 1; }; fi; echo "$1 -> $2:$3 $got"; }
          # Shape: internal, exact membership, fixed addresses.
          test "$(docker network inspect -f '{{.Internal}}' "$NET")" = true
          members="$(docker network inspect -f '{{range .Containers}}{{.Name}}={{.IPv4Address}} {{end}}' "$NET" | tr ' ' '\n' | sed '/^$/d' | LC_ALL=C sort | tr '\n' ' ')"
          echo "members: $members"
          test "$members" = "cf-product-admin-staging-cfmeet-admin-1=10.231.14.3/28 cfmeet-admin-bridge-hq-relay=10.231.14.2/28 "
          # The relay is on no other HQ network; CF Meet Admin is on its own two networks only.
          test "$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' cfmeet-admin-bridge-hq-relay | tr ' ' '\n' | sed '/^$/d' | LC_ALL=C sort | tr '\n' ' ')" = "cf-staging-cfmeet-bridge cm-standin-ops "
          test "$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$CM" | tr ' ' '\n' | sed '/^$/d' | LC_ALL=C sort | tr '\n' ' ')" = "cf-staging-cfmeet-admin-db cf-staging-cfmeet-bridge "
          # Admitted sources reach the relay: CF Meet Admin (.3) and a stand-in for the worker at its fixed .4.
          test "$(banner exec "$CM" -- 10.231.14.2 8460)" = relay-ok
          test "$(banner run --rm --network "$NET" --ip 10.231.14.4 node:22-alpine -- 10.231.14.2 8460)" = relay-ok
          # An unauthorized container ON the network is refused by the relay ACL, and the membership audit fails while it is there.
          docker run -d --name rogue --network "$NET" --ip 10.231.14.5 node:22-alpine node -e "setInterval(()=>{},1<<30)" >/dev/null
          test "$(banner exec rogue -- 10.231.14.2 8460)" = CLOSED_WITHOUT_DATA
          : > "$PA_LOGS/preflight.log"
          if ops preflight; then echo "::error::preflight passed with an unauthorized member on $NET"; exit 1; fi
          grep -q '"id":"networks_internal_and_isolated","status":"FAIL".*rogue not permitted on cf-staging-cfmeet-bridge' "$PA_LOGS/preflight.log"
          grep -q '"id":"cfmeet_bridge_same_host_boundary","status":"FAIL".*rogue (10.231.14.5) is not permitted' "$PA_LOGS/preflight.log"
          docker rm -f rogue >/dev/null
          # Unauthorized containers OFF the network reach neither the relay nor the CF Meet Admin database network.
          cdb="$(docker inspect -f '{{with index .NetworkSettings.Networks "cf-staging-cfmeet-admin-db"}}{{.IPAddress}}{{end}}' cf-product-admin-staging-cfmeet-admin-db-1)"
          test -n "$cdb"
          for target in "10.231.14.2 8460" "$cdb 5432"; do
            # shellcheck disable=SC2086
            got="$(banner run --rm --network bridge node:22-alpine -- $target)"
            [[ "$got" == NO_CONNECTION* ]] || { echo "::error::an unauthorized container reached $target ($got)"; exit 1; }
            echo "unauthorized (default bridge) -> $target $got"
          done
          for c in cf-product-admin-staging-product-integration-core-1 cf-product-admin-staging-karryam-admin-1 rehearsal-api; do expect "$c" 10.231.14.2 8460 closed; done
          # The relay itself never reaches the CF Meet Admin database (it is not on that network).
          expect cfmeet-admin-bridge-hq-relay "$cdb" 5432 closed
          # CF Meet Admin: no route out of the internal network, no CF Meet operational database, no HQ or Karryam database.
          expect "$CM" 10.231.14.2 8460 open
          expect "$CM" 10.231.14.2 8461 closed
          expect "$CM" 1.1.1.1 443 closed
          expect "$CM" 1.1.1.1 53 closed
          expect "$CM" 10.231.14.1 22 closed
          expect "$CM" 10.232.0.5 5432 closed
          expect "$CM" hq-db 5432 closed
          expect "$CM" karryam-admin-db 5432 closed
          # No host listener and no published port 8460.
          if sudo ss -ltnH | awk '{print $4}' | grep -E ':8460$'; then echo "::error::a host process listens on 8460"; exit 1; fi
          if docker ps --format '{{.Names}} {{.Ports}}' | grep -E ':8460->|->8460/'; then echo "::error::a container publishes 8460"; exit 1; fi
      - name: The host checks fail closed (relay on an HQ network, connector on a CF Meet network, host listener on 8460, relay detached)
        run: |
          set -euo pipefail
          CM=cf-product-admin-staging-cfmeet-admin-1
          refused() { : > "$PA_LOGS/preflight.log"; if ops preflight; then echo "::error::preflight passed: $1"; exit 1; fi; grep -q "\"id\":\"cfmeet_bridge_same_host_boundary\",\"status\":\"FAIL\".*$2" "$PA_LOGS/preflight.log" || { echo "::error::expected cfmeet_bridge_same_host_boundary FAIL ($2)"; exit 1; }; }
          docker network connect cf-staging-karryam-bridge cfmeet-admin-bridge-hq-relay
          refused "relay on an HQ network" "also on the HQ network cf-staging-karryam-bridge"
          docker network disconnect cf-staging-karryam-bridge cfmeet-admin-bridge-hq-relay
          docker network connect cm-standin-ops "$CM"
          refused "CF Meet Admin on a CF Meet network" "$CM is also on cm-standin-ops"
          docker network disconnect cm-standin-ops "$CM"
          python3 -m http.server 8460 --bind 127.0.0.1 >/dev/null 2>&1 &
          srv=$!
          for i in $(seq 1 20); do ss -ltnH | grep -q ':8460 ' && break; sleep 0.5; done
          refused "host listener on 8460" "a host process listens on 8460"
          kill "$srv"; wait "$srv" 2>/dev/null || true
          : > "$PA_LOGS/preflight.log"; ops preflight
          grep -q '"id":"cfmeet_bridge_same_host_boundary","status":"PASS"' "$PA_LOGS/preflight.log"
          # Relay not attached: PENDING_EXTERNAL, never a pass; isolation still verified.
          docker network disconnect cf-staging-cfmeet-bridge cfmeet-admin-bridge-hq-relay
          : > "$PA_LOGS/network-probe.log"; ops network-probe
          grep -q '"id":"bridge_network_reachable_only_from_cfmeet","status":"PENDING_EXTERNAL"' "$PA_LOGS/network-probe.log"
          grep -q '"id":"network_flows","status":"PASS"' "$PA_LOGS/network-probe.log"
          : > "$PA_LOGS/preflight.log"; ops preflight
          grep -q '"id":"cfmeet_bridge_same_host_boundary","status":"PENDING_EXTERNAL".*not attached' "$PA_LOGS/preflight.log"
          docker network connect --ip 10.231.14.2 cf-staging-cfmeet-bridge cfmeet-admin-bridge-hq-relay
          : > "$PA_LOGS/network-probe.log"; ops network-probe
          grep -q '"id":"bridge_network_reachable_only_from_cfmeet","status":"PASS"' "$PA_LOGS/network-probe.log"
      - name: Host-side transport switch (same-host -> tunnel -> same-host), only while nothing is attached
        run: |
          set -euo pipefail
          internal() { docker network inspect -f '{{.Internal}}' cf-staging-cfmeet-bridge; }
          # Refused while CF Meet Admin and the relay are attached; the network is unchanged.
          if PA_CM_BRIDGE_MODE=tunnel PA_CM_BRIDGE_ADDRESS=10.250.0.1 ops prepare-host; then echo "::error::the network was switched with members attached"; exit 1; fi
          grep -q 'must become internal=false for PA_CM_BRIDGE_MODE=tunnel but has members' "$PA_LOGS/prepare-host.log"
          test "$(internal)" = true
          ops disable
          docker network disconnect cf-staging-cfmeet-bridge cfmeet-admin-bridge-hq-relay
          PA_CM_BRIDGE_MODE=tunnel PA_CM_BRIDGE_ADDRESS=10.250.0.1 ops prepare-host
          test "$(internal)" = false
          sudo iptables -S DOCKER-USER | grep -Eq -- '-d 10.250.0.1/32 -p tcp( -m tcp)? --dport 8460'
          sudo iptables -S DOCKER-USER | grep -q -- '-A DOCKER-USER -s 10.231.14.0/28 -m comment --comment cf-product-admin -j DROP'
          if docker inspect cf-product-admin-staging-cfmeet-admin-1 >/dev/null 2>&1; then echo "::error::the stopped CF Meet Admin container still references the old network"; exit 1; fi
          # And back: the tunnel allowlist and subnet drops disappear exactly.
          ops prepare-host
          test "$(internal)" = true
          if sudo iptables -S DOCKER-USER | grep -Eq -- '10.250.0.1/32|-(s|d) 10.231.14.0/28 -m comment'; then echo "::error::stale tunnel rules after switching back to same-host"; exit 1; fi
          docker network connect --ip 10.231.14.2 cf-staging-cfmeet-bridge cfmeet-admin-bridge-hq-relay
          : > "$PA_LOGS/deploy.log"
          PA_PIC_IMAGE="$PIC1" PA_KA_IMAGE="$KA1" PA_CM_IMAGE="$CM1" PA_RELEASE_SHA="$GITHUB_SHA" ops deploy
          for c in cfmeet_bridge_same_host_boundary bridge_network_reachable_only_from_cfmeet network_membership_matches_policy network_flows; do
            grep -q "PA_CHECK {\"id\":\"$c\",\"status\":\"PASS\"" "$PA_LOGS/deploy.log" || { echo "::error::expected $c=PASS after the switch back"; exit 1; }
          done
          test "$(docker inspect -f '{{with index .NetworkSettings.Networks "cf-staging-cfmeet-bridge"}}{{.IPAddress}}{{end}}' cf-product-admin-staging-cfmeet-admin-1)" = 10.231.14.3
          sudo chown -R "$(id -u):$(id -g)" "$PA_LOGS" || true
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}} {{.Image}}'
          docker network inspect cf-staging-cfmeet-bridge || true
          sudo iptables -S DOCKER-USER || true
          for c in $(docker ps -a --filter label=com.docker.compose.project=cf-product-admin-staging --format '{{.Names}}'); do echo "== $c"; docker logs --tail 60 "$c" 2>&1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-admin-release-rehearsal-same-host
          path: _rehearsal_same_host/
          if-no-files-found: warn
