name: CA DB cutover script tests (disposable replica)

# Runs .github/scripts/ca-db-isolation-cutover.sh UNMODIFIED against a
# disposable replica of the VPS layout on the GitHub runner (real Docker,
# Compose and PostgreSQL 16). No secrets, no SSH, nothing outside the runner.

on:
  pull_request:
    paths:
      - .github/scripts/ca-db-isolation-cutover.sh
      - .github/scripts/tests/ca-db-cutover-replica.sh
      - .github/workflows/ca-db-cutover-test.yml
  push:
    branches: [staging]
    paths:
      - .github/scripts/ca-db-isolation-cutover.sh
      - .github/scripts/tests/ca-db-cutover-replica.sh
      - .github/workflows/ca-db-cutover-test.yml

permissions:
  contents: read

jobs:
  replica:
    name: Cutover on a disposable replica
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable -S warning /mnt/.github/scripts/ca-db-isolation-cutover.sh /mnt/.github/scripts/tests/ca-db-cutover-replica.sh
      - name: Full run, failures, rollbacks and rerun
        run: sudo CA_REPLICA_TEST=1 bash .github/scripts/tests/ca-db-cutover-replica.sh run-all
      - name: Production guards
        run: sudo CA_REPLICA_TEST=1 bash .github/scripts/tests/ca-db-cutover-replica.sh run-guards
