name: Admin frontend typed lint repair
# Preserve Next.js client directives after leading file comments
# Re-run after syntax correction to migration script

on:
  push:
    branches: [feature/import-main-admin-frontend]
    paths:
      - ".github/workflows/frontend-typed-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/import-main-admin-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Type charts and map callbacks
        run: node frontend/scripts/repair-lint-types.mjs
      - name: Ensure TypeScript and production build pass
        working-directory: frontend
        run: npm run build
      - name: Commit typed changes
        run: |
          git diff --check
          git add frontend/src
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(admin-frontend): strongly type chart tooltip props and array callbacks"
            git push origin HEAD:feature/import-main-admin-frontend
          fi
